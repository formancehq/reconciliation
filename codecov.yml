codecov:
  require_ci_to_pass: false

coverage:
  status:
    project:
      default:
        target: auto      # don't regress from the base branch
        threshold: 1%     # allow 1% fluctuation
    patch:
      default:
        target: 80%       # new code should be at least 80% covered

# Exclude generated code and test utilities from coverage metrics.
#
# The vendored Ledger v3 bindings dominate this repository by volume:
# ~98k generated statements against ~4k hand-written ones. Counting them makes
# the reported figure meaningless — the same suite reads 4.5% with them and
# ~76% without — and a proto re-sync rewrites most of them at once, so the
# trend line tracks upstream churn rather than anything about this codebase.
# Every generated file under internal/ledgerpb ends in .pb.go; grpcprotocol is
# hand-written and deliberately stays in scope.
ignore:
  - "internal/ledgerpb/**/*.pb.go"
  - "**/*_generated.go"
  - "cmd/**"
  - "main.go"
