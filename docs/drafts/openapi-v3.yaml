# Reconciliation v3.0.0 public API, draft. Generated from the prototype contract by
# a one-off script, then reviewed by hand. Edit this file directly from now on.
openapi: 3.0.3
info:
  title: Reconciliation API
  version: 3.0.0-draft
  description: |
    **Draft contract for reconciliation `v3.0.0`.** No code serves it yet. It records the public API
    decided in RFC 0022 "Reconciliation v3 on Ledger v3" (formancehq/internal-rfcs#37). The HTTP API
    slice (S12, EN-2762) implements it and replaces `openapi.yaml`.

    ## Conventions

    - **Errors.** Every failure returns `ErrorResponse` with a stable `errorCode` from the RFC-0016
      taxonomy: 400 `VALIDATION`, 401 `UNAUTHENTICATED`, 403 `PERMISSION_DENIED`, 404 `NOT_FOUND`,
      409 `CONFLICT` and its specific codes, 503 `UNAVAILABLE` with `Retry-After`, 500 `INTERNAL`.
      There is no 422: a business rule broken by the input is `VALIDATION`, and an action the current
      state forbids is `INVALID_TRANSITION`.
    - **Optimistic concurrency.** A rule or an alert carries an integer `version`, returned as
      `ETag`. Writes accept `If-Match` and answer 409 `VERSION_MISMATCH` on a stale version.
    - **Idempotency.** Writes accept an `Idempotency-Key`, kept 24 hours. A replay returns the first
      outcome with `Idempotent-Replay: true`.
    - **Request IDs.** Every response carries `X-Request-ID`, the caller's or a generated one.
    - **Pagination.** Opaque cursors in the Formance cursor envelope. A stable order with a unique
      tie-breaker per list. The absence of `next` ends the traversal.
    - **Amounts.** Every amount is an integer string in minor units of its asset (`USD/2`: 150 is
      $1.50), tolerances included, and nothing is ever converted or rounded. An asset without a
      tolerance entry is checked exactly.
    - **Authorization.** Bearer JWT. Reads need `reconciliation:read`, writes `reconciliation:write`.

    ## Not in v3.0.0

    Removed from v2: `/policies`, `/reconciliations`, `/evaluations` (captures replace them), the `at`
    parameter of evaluate, the rule `notifications` field, `compiledCEL` and `explanationCEL`.

    Added in later v3 minors: snooze and unsnooze, `/alerts/{alertID}/events`,
    `/rules/{ruleID}/timeline`, the `exchange_rate_bounds`, `coverage_ratio_bounds` and `stale_holds`
    templates, the audit API, and the gRPC contract.
security:
- BearerAuth: []
paths:
  /_info:
    get:
      operationId: getServerInfo
      summary: Server information
      security: []
      parameters:
      - $ref: '#/components/parameters/XRequestID'
      responses:
        '200':
          $ref: '#/components/responses/ServerInfo'
        '500':
          $ref: '#/components/responses/InternalError'
  /rules:
    post:
      operationId: createRule
      summary: Create a rule
      description: |
        Validates the template spec and creates the rule at version 1.

        Requires `reconciliation:write`.
      parameters:
      - $ref: '#/components/parameters/XRequestID'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          $ref: '#/components/responses/Rule'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleRequest'
    get:
      operationId: listRules
      summary: List rules
      description: |
        Ordered by `createdAt` descending, then `id`. The rule ID is a UUIDv7, which starts with the
        creation time, so the ledger serves this order natively. Each rule carries its live alert
        counts.

        Requires `reconciliation:read`.
      parameters:
      - $ref: '#/components/parameters/XRequestID'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/RuleEnabled'
      - $ref: '#/components/parameters/TemplateKindFilter'
      responses:
        '200':
          $ref: '#/components/responses/Rules'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /rules/{ruleID}:
    parameters:
    - $ref: '#/components/parameters/RuleID'
    get:
      operationId: getRule
      summary: Get a rule
      description: |
        Returns the rule and its version in `ETag`.

        Requires `reconciliation:read`.
      parameters:
      - $ref: '#/components/parameters/XRequestID'
      responses:
        '200':
          $ref: '#/components/responses/Rule'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    patch:
      operationId: patchRule
      summary: Update a rule
      description: |
        Applies a partial update and increases the version by one.

        Requires `reconciliation:write`.
      parameters:
      - $ref: '#/components/parameters/XRequestID'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          $ref: '#/components/responses/Rule'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RulePatchRequest'
    delete:
      operationId: deleteRule
      summary: Delete a rule
      description: |
        Stops the rule's evaluations. Its captures stay readable.

        Requires `reconciliation:write`.
      parameters:
      - $ref: '#/components/parameters/XRequestID'
      - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /rules/{ruleID}/evaluate:
    parameters:
    - $ref: '#/components/parameters/RuleID'
    post:
      operationId: evaluateRule
      summary: Evaluate a rule now
      description: |
        Evaluates the rule for the period of the current time and commits the capture and every
        alert transition in one atomic write. Evaluating a past period is not supported. A
        concurrent evaluation of the same rule is re-planned by the server; 409 means it kept
        losing to other evaluations. A failing read or write is recorded as a capture with
        `verdict: error` and raises the rule's `evaluation.failed` meta-alert.

        Requires `reconciliation:write`.
      parameters:
      - $ref: '#/components/parameters/XRequestID'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          $ref: '#/components/responses/Capture'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /rules/{ruleID}/captures:
    parameters:
    - $ref: '#/components/parameters/RuleID'
    get:
      operationId: listRuleCaptures
      summary: List a rule's captures
      description: |
        One capture per evaluation, newest first.

        Requires `reconciliation:read`.
      parameters:
      - $ref: '#/components/parameters/XRequestID'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/PeriodID'
      - $ref: '#/components/parameters/Verdict'
      responses:
        '200':
          $ref: '#/components/responses/Captures'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /alerts:
    get:
      operationId: listAlerts
      summary: List alerts
      description: |
        Defaults to the active view (`OPEN` and `ACKNOWLEDGED`). Ordered by `id`: a stable order
        that does not follow time, served natively by the ledger. Sort by `lastSeenAt` on the
        client. A server-side sort by time waits for the ledger to order lists by a field
        (Jira EN-1351).

        Requires `reconciliation:read`.
      parameters:
      - $ref: '#/components/parameters/XRequestID'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/AlertStatus'
      - $ref: '#/components/parameters/AlertRuleID'
      - $ref: '#/components/parameters/PeriodID'
      - $ref: '#/components/parameters/SeverityFilter'
      responses:
        '200':
          $ref: '#/components/responses/Alerts'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /alerts/{alertID}:
    parameters:
    - $ref: '#/components/parameters/AlertID'
    get:
      operationId: getAlert
      summary: Get an alert
      description: |
        Returns the alert and its version in `ETag`.

        Requires `reconciliation:read`.
      parameters:
      - $ref: '#/components/parameters/XRequestID'
      responses:
        '200':
          $ref: '#/components/responses/Alert'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /alerts/{alertID}/ack:
    parameters:
    - $ref: '#/components/parameters/AlertID'
    post:
      operationId: ackAlert
      summary: Acknowledge an alert
      description: |
        Moves an `OPEN` alert to `ACKNOWLEDGED`. Any other starting state answers 409 `INVALID_TRANSITION`.

        Requires `reconciliation:write`.
      parameters:
      - $ref: '#/components/parameters/XRequestID'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          $ref: '#/components/responses/Alert'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AckAlertRequest'
  /alerts/{alertID}/resolve:
    parameters:
    - $ref: '#/components/parameters/AlertID'
    post:
      operationId: resolveAlert
      summary: Resolve an alert
      description: |
        Closes an `OPEN` or `ACKNOWLEDGED` alert as fixed, for example by a corrective booking. Any other starting state answers 409 `INVALID_TRANSITION`.

        Requires `reconciliation:write`.
      parameters:
      - $ref: '#/components/parameters/XRequestID'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          $ref: '#/components/responses/Alert'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveAlertRequest'
  /alerts/{alertID}/accept:
    parameters:
    - $ref: '#/components/parameters/AlertID'
    post:
      operationId: acceptAlert
      summary: Accept an alert
      description: |
        Closes an `OPEN` or `ACKNOWLEDGED` alert as an accepted discrepancy, with a note. Any other starting state answers 409 `INVALID_TRANSITION`.

        Requires `reconciliation:write`.
      parameters:
      - $ref: '#/components/parameters/XRequestID'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          $ref: '#/components/responses/Alert'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptAlertRequest'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Scopes: `reconciliation:read` for reads, `reconciliation:write` for writes.'
  parameters:
    PageSize:
      name: pageSize
      in: query
      description: |
        The maximum number of results to return per page.
      example: 100
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 100
    Cursor:
      name: cursor
      in: query
      description: |
        Opaque cursor from `next` or `previous`. It carries the page size, the filters and the
        order, so the other query parameters are ignored when it is set. A tampered or
        expired cursor answers 400 `VALIDATION`. The absence of `next` ends the traversal.
      schema:
        type: string
        example: aHR0cHM6Ly9nLnBhZ2UvTmVrby1SYW1lbj9zaGFyZQ==
    RuleID:
      name: ruleID
      in: path
      required: true
      description: The rule ID.
      schema:
        type: string
        format: uuid
    AlertID:
      name: alertID
      in: path
      required: true
      description: The alert ID.
      schema:
        type: string
        format: uuid
    XRequestID:
      name: X-Request-ID
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
      description: Caller-supplied request identifier. The server generates one when absent.
    IfMatch:
      name: If-Match
      in: header
      required: false
      schema:
        type: string
      description: |
        The version read, as returned in `ETag`. A stale version answers 409 `VERSION_MISMATCH`.
        Without it, the server applies the change to the version it reads, and a concurrent
        change still answers 409.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 256
      description: |
        Client key for safe retries, scoped by caller and operation and kept 24 hours. The same
        key with the same request replays the first outcome without executing again. The same
        key with a different request answers 409 `IDEMPOTENCY_KEY_REUSED`.
    RuleEnabled:
      name: enabled
      in: query
      required: false
      schema:
        type: boolean
      description: Only enabled or only disabled rules.
    TemplateKindFilter:
      name: templateKind
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/TemplateKind'
    AlertStatus:
      name: status
      in: query
      required: false
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          enum:
          - OPEN
          - ACKNOWLEDGED
          - RESOLVED
        default:
        - OPEN
        - ACKNOWLEDGED
      description: 'Repeatable. Defaults to the active view: `OPEN` and `ACKNOWLEDGED`.'
    AlertRuleID:
      name: ruleID
      in: query
      required: false
      schema:
        type: string
        format: uuid
    PeriodID:
      name: periodID
      in: query
      required: false
      schema:
        type: string
      description: Only this period, for example `2026-10` on a monthly rule.
    SeverityFilter:
      name: severity
      in: query
      required: false
      style: form
      explode: true
      schema:
        type: array
        items:
          $ref: '#/components/schemas/Severity'
      description: Repeatable.
    Verdict:
      name: verdict
      in: query
      required: false
      schema:
        type: string
        enum:
        - pass
        - fail
        - error
  headers:
    XRequestID:
      description: 'The request identifier: the caller''s `X-Request-ID`, or one the server generated.'
      schema:
        type: string
    ETag:
      description: The current version of the resource, as a quoted integer, for example `"3"`.
      schema:
        type: string
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
    IdempotentReplay:
      description: '`true` when the response replays the outcome of an earlier request with the same `Idempotency-Key`.'
      schema:
        type: boolean
  responses:
    Rule:
      description: The rule.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
        ETag:
          $ref: '#/components/headers/ETag'
        Idempotent-Replay:
          $ref: '#/components/headers/IdempotentReplay'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RuleResponse'
    Rules:
      description: A page of rules.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RulesCursorResponse'
    Alert:
      description: The alert.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
        ETag:
          $ref: '#/components/headers/ETag'
        Idempotent-Replay:
          $ref: '#/components/headers/IdempotentReplay'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AlertResponse'
    Alerts:
      description: A page of alerts.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AlertsCursorResponse'
    Capture:
      description: The capture of the evaluation.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
        Idempotent-Replay:
          $ref: '#/components/headers/IdempotentReplay'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CaptureResponse'
    Captures:
      description: A page of captures, newest first.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CapturesCursorResponse'
    ServerInfo:
      description: Server information.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ServerInfo'
    NoContent:
      description: No content.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
    BadRequest:
      description: '`VALIDATION`: malformed input, an invalid spec or an invalid cursor.'
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: '`UNAUTHENTICATED`: missing or invalid bearer token.'
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: '`PERMISSION_DENIED`: the token lacks the required scope.'
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: '`NOT_FOUND`: no such resource.'
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: '`VERSION_MISMATCH`, `INVALID_TRANSITION`, `IDEMPOTENCY_KEY_REUSED` or `CONFLICT`:
        the current state prevents the change.'
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: '`UNAVAILABLE`: the ledger is unreachable or overloaded. Retry after the delay.'
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: '`INTERNAL`: unexpected server failure.'
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    AcceptAlertRequest:
      type: object
      required:
      - by
      - note
      properties:
        by:
          type: string
        note:
          type: string
          minLength: 1
        expiresAt:
          type: string
          format: date-time
          description: |
            Mandatory on a rule with `periodType: continuous`, at most 90 days ahead. Rejected on a
            periodic rule, whose acceptance ends with the period.
    AccountMetadataNamedSource:
      type: object
      required:
      - id
      - kind
      - ledger
      - query
      - metadataKey
      - asset
      properties:
        id:
          $ref: '#/components/schemas/SourceID'
        label:
          type: string
        kind:
          type: string
          enum:
          - account_metadata
        ledger:
          type: string
          minLength: 1
        query:
          type: object
          additionalProperties: true
        metadataKey:
          type: string
          minLength: 1
          description: Opaque metadata key; the asset is declared independently.
        asset:
          $ref: '#/components/schemas/Asset'
    Ack:
      type: object
      required:
      - by
      - at
      properties:
        by:
          type: string
        at:
          type: string
          format: date-time
        note:
          type: string
    AckAlertRequest:
      type: object
      required:
      - by
      properties:
        by:
          type: string
          example: ops@buildr.com
        note:
          type: string
    Alert:
      type: object
      required:
      - id
      - version
      - ruleID
      - fingerprint
      - periodID
      - status
      - severity
      - firstSeenAt
      - lastSeenAt
      - occurrenceCount
      - lastEvaluationID
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
          description: Stable identifier. Lists order alerts by it.
        version:
          type: integer
          format: int64
          minimum: 1
          readOnly: true
          description: Increases by one on every transition. Returned as the `ETag` of the alert.
        ruleID:
          type: string
          format: uuid
        fingerprint:
          type: string
        periodID:
          type: string
        status:
          type: string
          enum:
          - OPEN
          - ACKNOWLEDGED
          - RESOLVED
          description: '`RESOLVED` covers both a fix and an acceptance: `resolution.kind` tells them apart.'
        severity:
          $ref: '#/components/schemas/Severity'
        firstSeenAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        occurrenceCount:
          type: integer
          format: int64
          description: Number of failing evaluations since the alert opened.
        lastEvaluationID:
          type: string
          format: uuid
        evidence:
          $ref: '#/components/schemas/Evidence'
        ack:
          $ref: '#/components/schemas/Ack'
        resolution:
          $ref: '#/components/schemas/Resolution'
        labels:
          type: object
          additionalProperties:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AlertCounts:
      type: object
      readOnly: true
      description: |
        A rule's live alert counts, served on the rule list only. Resolved and accepted alerts are
        counted in neither figure. Absent on single-rule reads, where `/alerts` answers the question:
        absent means not asked, never zero.
      required:
      - open
      - acknowledged
      properties:
        open:
          type: integer
          format: int64
          description: Alerts currently OPEN for this rule, across every period.
        acknowledged:
          type: integer
          format: int64
          description: Alerts currently ACKNOWLEDGED for this rule, across every period.
    AlertResponse:
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/Alert'
    AlertsCursorResponse:
      type: object
      required:
      - cursor
      properties:
        cursor:
          type: object
          required:
          - pageSize
          - hasMore
          - data
          properties:
            pageSize:
              type: integer
              format: int64
            hasMore:
              type: boolean
            previous:
              type: string
            next:
              type: string
            data:
              type: array
              items:
                $ref: '#/components/schemas/Alert'
    Asset:
      type: string
      minLength: 1
      description: |
        Ledger asset code including precision, for example `USD/2`. On a source, `*` declares
        every asset the account set holds, and the check yields one outcome per asset.
        Alignment is by exact asset code, and a spec is wholly `*` or wholly fixed.
      example: USD/2
    BalanceBound:
      type: object
      description: |
        One asset's inclusive limits, in that asset's minor units. Either side may
        be omitted, which means **unbounded on that side** — not zero. At least
        one must be set. `min == max` is legal and means exact equality. Both are
        signed: a threshold on a liability or obligation set is negative.
      properties:
        min:
          $ref: '#/components/schemas/SignedIntegerString'
        max:
          $ref: '#/components/schemas/SignedIntegerString'
    BalanceBoundsEvidence:
      type: object
      required:
      - schemaVersion
      - operation
      - asset
      - source
      - effectiveBounds
      - excursion
      properties:
        schemaVersion:
          type: integer
          format: int32
          enum:
          - 3
        operation:
          type: string
          enum:
          - balance_bounds
        asset:
          $ref: '#/components/schemas/Asset'
        source:
          $ref: '#/components/schemas/EvidenceSource'
        effectiveBounds:
          $ref: '#/components/schemas/BalanceBound'
        excursion:
          allOf:
          - $ref: '#/components/schemas/SignedIntegerString'
          description: Signed distance to the breached bound, zero when inside.
        breachedBound:
          type: string
          enum:
          - min
          - max
          description: Present when the check failed.
    BalanceBoundsRule:
      allOf:
      - $ref: '#/components/schemas/RuleCommon'
      - type: object
        required:
        - templateKind
        - templateSpec
        properties:
          templateKind:
            type: string
            enum:
            - balance_bounds
          templateSpec:
            $ref: '#/components/schemas/BalanceBoundsSpec'
    BalanceBoundsRuleRequest:
      allOf:
      - $ref: '#/components/schemas/RuleRequestCommon'
      - type: object
        required:
        - templateKind
        - templateSpec
        properties:
          templateKind:
            type: string
            enum:
            - balance_bounds
          templateSpec:
            $ref: '#/components/schemas/BalanceBoundsSpec'
    BalanceBoundsSpec:
      type: object
      description: |
        Asserts that one named source's balance stays inside inclusive per-asset limits.
        The keys of `bounds` are exactly the assets checked: an asset named there that
        the source does not hold is checked as zero, so a floor keeps failing when the
        account set drains. A source naming one asset must bound exactly that asset;
        declare `asset: "*"` on the source to bound several. Bounds are in minor units.
      required:
      - source
      - bounds
      properties:
        source:
          allOf:
          - $ref: '#/components/schemas/NamedSource'
          description: The account set whose balance is bounded. `account_metadata` sources are accepted.
        bounds:
          type: object
          minProperties: 1
          maxProperties: 256
          additionalProperties:
            $ref: '#/components/schemas/BalanceBound'
          description: |
            Inclusive limits keyed by asset code — and the declared asset
            universe. An asset named here that the source does not hold is
            checked as an explicit zero. An asset the source holds that is not
            named here is not checked. `*` is not accepted as a key: a bound is
            denominated.
          example:
            USD/2:
              min: '100000'
              max: '5000000'
            EUR/2:
              min: '50000'
    BalanceEquationEvidence:
      type: object
      required:
      - schemaVersion
      - operation
      - asset
      - sources
      - residual
      - absoluteResidual
      - tolerance
      properties:
        schemaVersion:
          type: integer
          format: int32
          enum:
          - 3
        operation:
          type: string
          enum:
          - balance_equation
        asset:
          $ref: '#/components/schemas/Asset'
        sources:
          type: array
          minItems: 2
          maxItems: 32
          items:
            $ref: '#/components/schemas/BalanceEquationEvidenceSource'
        residual:
          $ref: '#/components/schemas/SignedIntegerString'
        absoluteResidual:
          $ref: '#/components/schemas/UnsignedIntegerString'
        tolerance:
          allOf:
          - $ref: '#/components/schemas/UnsignedIntegerString'
          description: The effective tolerance for this asset, in minor units.
    BalanceEquationEvidenceSource:
      allOf:
      - $ref: '#/components/schemas/EvidenceSource'
      - type: object
        required:
        - coefficient
        - contribution
        properties:
          coefficient:
            oneOf:
            - type: integer
              format: int64
              maximum: -1
            - type: integer
              format: int64
              minimum: 1
          contribution:
            $ref: '#/components/schemas/SignedIntegerString'
    BalanceEquationRule:
      allOf:
      - $ref: '#/components/schemas/RuleCommon'
      - type: object
        required:
        - templateKind
        - templateSpec
        properties:
          templateKind:
            type: string
            enum:
            - balance_equation
          templateSpec:
            $ref: '#/components/schemas/BalanceEquationSpec'
    BalanceEquationRuleRequest:
      allOf:
      - $ref: '#/components/schemas/RuleRequestCommon'
      - type: object
        required:
        - templateKind
        - templateSpec
        properties:
          templateKind:
            type: string
            enum:
            - balance_equation
          templateSpec:
            $ref: '#/components/schemas/BalanceEquationSpec'
    BalanceEquationSpec:
      type: object
      description: |
        Checks `abs(sum(coefficient * balance)) <= tolerance` for sources declaring the
        same asset. An absent source reads zero.
      required:
      - sources
      - terms
      properties:
        sources:
          type: array
          minItems: 2
          maxItems: 32
          items:
            $ref: '#/components/schemas/NamedSource'
          description: Ordered sources with unique IDs. Every source must declare the same asset.
        terms:
          type: array
          minItems: 2
          maxItems: 32
          items:
            $ref: '#/components/schemas/BalanceEquationTerm'
          description: Each source ID must be referenced exactly once.
        tolerances:
          $ref: '#/components/schemas/Tolerances'
    BalanceEquationTerm:
      type: object
      required:
      - source
      - coefficient
      properties:
        source:
          $ref: '#/components/schemas/SourceID'
        coefficient:
          description: Non-zero signed integer coefficient for this source.
          oneOf:
          - type: integer
            format: int64
            maximum: -1
          - type: integer
            format: int64
            minimum: 1
    Capture:
      type: object
      required:
      - transactionID
      - ruleID
      - periodID
      - evaluationID
      - templateKind
      - verdict
      - trigger
      - capturedAt
      properties:
        transactionID:
          type: integer
          format: int64
        ruleID:
          type: string
          format: uuid
        periodID:
          type: string
        evaluationID:
          type: string
          format: uuid
        templateKind:
          $ref: '#/components/schemas/TemplateKind'
        verdict:
          type: string
          enum:
          - pass
          - fail
          - error
        trigger:
          type: string
          enum:
          - scheduled
          - manual
        capturedAt:
          type: string
          format: date-time
        ruleRevision:
          type: string
        error:
          type: string
          description: Diagnostic message when `verdict` is `error`. Not a stable value.
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/Outcome'
          description: One outcome per fingerprint, failing outcomes first when truncated.
        evidenceTruncated:
          type: boolean
          description: True when the evidence exceeded its byte budget and was cut deterministically.
        evidenceDigest:
          type: string
          description: SHA-256 of the full evidence, present when `evidenceTruncated` is true.
        failedStage:
          type: string
          enum:
          - read
          - evaluate
          - write
          description: The failing stage when `verdict` is `error`.
    CaptureResponse:
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/Capture'
    CapturesCursorResponse:
      type: object
      required:
      - cursor
      properties:
        cursor:
          type: object
          required:
          - pageSize
          - hasMore
          - data
          properties:
            pageSize:
              type: integer
              format: int64
            hasMore:
              type: boolean
            previous:
              type: string
            next:
              type: string
            data:
              type: array
              items:
                $ref: '#/components/schemas/Capture'
    ErrorResponse:
      type: object
      required:
      - errorCode
      - errorMessage
      description: |
        Error envelope. Clients branch on `errorCode` and the HTTP status, never on
        `errorMessage`. Codes follow the RFC-0016 taxonomy and stay stable within v3.
      properties:
        errorCode:
          type: string
          enum:
          - VALIDATION
          - UNAUTHENTICATED
          - PERMISSION_DENIED
          - NOT_FOUND
          - CONFLICT
          - VERSION_MISMATCH
          - INVALID_TRANSITION
          - IDEMPOTENCY_KEY_REUSED
          - UNAVAILABLE
          - DEADLINE_EXCEEDED
          - INTERNAL
          description: |
            `VERSION_MISMATCH`, `INVALID_TRANSITION` and `IDEMPOTENCY_KEY_REUSED` are specific
            `conflict` codes, answered with HTTP 409.
        errorMessage:
          type: string
          description: Diagnostic text. Not a stable value.
        details:
          type: string
          description: Actionable detail, such as the invalid field path.
    Evidence:
      oneOf:
      - $ref: '#/components/schemas/BalanceBoundsEvidence'
      - $ref: '#/components/schemas/BalanceEquationEvidence'
      - $ref: '#/components/schemas/SourceConsensusEvidence'
      discriminator:
        propertyName: operation
        mapping:
          balance_bounds: '#/components/schemas/BalanceBoundsEvidence'
          balance_equation: '#/components/schemas/BalanceEquationEvidence'
          source_consensus: '#/components/schemas/SourceConsensusEvidence'
    EvidenceSource:
      type: object
      required:
      - id
      - kind
      - asset
      - balance
      - present
      properties:
        id:
          $ref: '#/components/schemas/SourceID'
        label:
          type: string
        kind:
          type: string
          enum:
          - ledger
          - account_metadata
        asset:
          $ref: '#/components/schemas/Asset'
        balance:
          $ref: '#/components/schemas/SignedIntegerString'
        present:
          type: boolean
        readAt:
          type: string
          format: date-time
          description: When the source was read. Sources of one ledger with disjoint selectors share one
            read.
    LedgerNamedSource:
      type: object
      required:
      - id
      - ledger
      - query
      - asset
      properties:
        id:
          $ref: '#/components/schemas/SourceID'
        label:
          type: string
        kind:
          type: string
          enum:
          - ledger
          default: ledger
        ledger:
          type: string
          minLength: 1
        query:
          type: object
          additionalProperties: true
        asset:
          $ref: '#/components/schemas/Asset'
    NamedSource:
      oneOf:
      - $ref: '#/components/schemas/LedgerNamedSource'
      - $ref: '#/components/schemas/AccountMetadataNamedSource'
      discriminator:
        propertyName: kind
        mapping:
          ledger: '#/components/schemas/LedgerNamedSource'
          account_metadata: '#/components/schemas/AccountMetadataNamedSource'
    Outcome:
      type: object
      required:
      - fingerprint
      - passed
      - evidence
      properties:
        fingerprint:
          type: string
        passed:
          type: boolean
        evidence:
          $ref: '#/components/schemas/Evidence'
    PeriodType:
      type: string
      enum:
      - continuous
      - daily
      - weekly
      - monthly
      default: continuous
    Resolution:
      type: object
      required:
      - kind
      - by
      - at
      properties:
        kind:
          type: string
          enum:
          - auto
          - fixed_by_booking
          - accepted_by_business
        by:
          type: string
        at:
          type: string
          format: date-time
        note:
          type: string
        transactionRefs:
          type: array
          items:
            type: string
        evidenceSnapshot:
          allOf:
          - $ref: '#/components/schemas/Evidence'
          description: |
            For an acceptance: the evidence accepted. The alert stays closed while new failures keep the
            same amount and sign, and reopens when the evidence changes or at `expiresAt`.
        expiresAt:
          type: string
          format: date-time
          description: 'For an acceptance: when it ends and the alert can reopen.'
    ResolveAlertRequest:
      type: object
      required:
      - by
      properties:
        by:
          type: string
        note:
          type: string
        transactionRefs:
          type: array
          items:
            type: string
    Rule:
      oneOf:
      - $ref: '#/components/schemas/BalanceBoundsRule'
      - $ref: '#/components/schemas/BalanceEquationRule'
      - $ref: '#/components/schemas/SourceConsensusRule'
      discriminator:
        propertyName: templateKind
        mapping:
          balance_bounds: '#/components/schemas/BalanceBoundsRule'
          balance_equation: '#/components/schemas/BalanceEquationRule'
          source_consensus: '#/components/schemas/SourceConsensusRule'
    RuleCommon:
      type: object
      required:
      - id
      - version
      - name
      - enabled
      - severity
      - periodType
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
          description: A UUIDv7, which starts with the creation time, so lists sort rules by creation
            natively.
        version:
          type: integer
          format: int64
          minimum: 1
          readOnly: true
          description: Increases by one on every change. Returned as the `ETag` of the rule.
        revision:
          type: string
          description: Content-derived identifier of the effective rule configuration, recorded in each
            capture.
        name:
          type: string
        enabled:
          type: boolean
        severity:
          $ref: '#/components/schemas/Severity'
        periodType:
          $ref: '#/components/schemas/PeriodType'
        schedule:
          $ref: '#/components/schemas/Schedule'
        labels:
          type: object
          additionalProperties:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        lastEvaluatedAt:
          type: string
          format: date-time
          readOnly: true
          description: When the rule last completed an evaluation. Absent until the rule has run at least
            once — which is not the same as a rule that ran and passed, so a consumer must render the
            absence as unknown rather than green. Stamped by each evaluation; never accepted on create
            or patch.
        lastVerdict:
          type: string
          enum:
          - pass
          - fail
          - error
          readOnly: true
          description: Outcome of the evaluation named by lastEvaluatedAt. `error` is an engine-side failure
            (resolver timeout, budget exceeded), not a data break. Absent until the rule has run.
        alerts:
          $ref: '#/components/schemas/AlertCounts'
    RulePatchRequest:
      type: object
      description: |
        Partial update. A changed definition is validated as a complete definition.
        Send `If-Match` with the version read to refuse a concurrent change.
      properties:
        name:
          type: string
          minLength: 1
        templateKind:
          $ref: '#/components/schemas/TemplateKind'
        templateSpec:
          oneOf:
          - $ref: '#/components/schemas/BalanceBoundsSpec'
          - $ref: '#/components/schemas/BalanceEquationSpec'
          - $ref: '#/components/schemas/SourceConsensusSpec'
        enabled:
          type: boolean
        severity:
          $ref: '#/components/schemas/Severity'
        schedule:
          $ref: '#/components/schemas/Schedule'
        labels:
          type: object
          additionalProperties:
            type: string
    RuleRequest:
      oneOf:
      - $ref: '#/components/schemas/BalanceBoundsRuleRequest'
      - $ref: '#/components/schemas/BalanceEquationRuleRequest'
      - $ref: '#/components/schemas/SourceConsensusRuleRequest'
      discriminator:
        propertyName: templateKind
        mapping:
          balance_bounds: '#/components/schemas/BalanceBoundsRuleRequest'
          balance_equation: '#/components/schemas/BalanceEquationRuleRequest'
          source_consensus: '#/components/schemas/SourceConsensusRuleRequest'
    RuleRequestCommon:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
        severity:
          $ref: '#/components/schemas/Severity'
        periodType:
          $ref: '#/components/schemas/PeriodType'
        schedule:
          $ref: '#/components/schemas/Schedule'
        labels:
          type: object
          additionalProperties:
            type: string
        enabled:
          type: boolean
    RuleResponse:
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/Rule'
    RulesCursorResponse:
      type: object
      required:
      - cursor
      properties:
        cursor:
          type: object
          required:
          - pageSize
          - hasMore
          - data
          properties:
            pageSize:
              type: integer
              format: int64
              minimum: 1
              maximum: 100
            hasMore:
              type: boolean
            previous:
              type: string
            next:
              type: string
            data:
              type: array
              items:
                $ref: '#/components/schemas/Rule'
    Schedule:
      type: object
      required:
      - kind
      properties:
        kind:
          type: string
          enum:
          - on_demand
          - cron
        expr:
          type: string
          example: '*/15 * * * *'
        tz:
          type: string
          example: UTC
    ServerInfo:
      type: object
      required:
      - version
      properties:
        version:
          type: string
    Severity:
      type: string
      enum:
      - info
      - low
      - medium
      - high
      - critical
    SignedIntegerString:
      type: string
      pattern: ^-?(0|[1-9][0-9]*)$
      description: A signed base-10 integer encoded as a string to avoid JSON precision loss.
      example: '-1250'
    SourceConsensusEvidence:
      type: object
      required:
      - schemaVersion
      - operation
      - asset
      - sources
      - minimumSource
      - minimumBalance
      - maximumSource
      - maximumBalance
      - spread
      - tolerance
      - missingSources
      properties:
        schemaVersion:
          type: integer
          format: int32
          enum:
          - 3
        operation:
          type: string
          enum:
          - source_consensus
        asset:
          $ref: '#/components/schemas/Asset'
        sources:
          type: array
          minItems: 2
          maxItems: 32
          items:
            $ref: '#/components/schemas/EvidenceSource'
        minimumSource:
          $ref: '#/components/schemas/SourceID'
        minimumBalance:
          $ref: '#/components/schemas/SignedIntegerString'
        maximumSource:
          $ref: '#/components/schemas/SourceID'
        maximumBalance:
          $ref: '#/components/schemas/SignedIntegerString'
        spread:
          $ref: '#/components/schemas/UnsignedIntegerString'
        tolerance:
          allOf:
          - $ref: '#/components/schemas/UnsignedIntegerString'
          description: The effective tolerance for this asset, in minor units.
        missingSources:
          type: array
          items:
            $ref: '#/components/schemas/SourceID'
    SourceConsensusRule:
      allOf:
      - $ref: '#/components/schemas/RuleCommon'
      - type: object
        required:
        - templateKind
        - templateSpec
        properties:
          templateKind:
            type: string
            enum:
            - source_consensus
          templateSpec:
            $ref: '#/components/schemas/SourceConsensusSpec'
    SourceConsensusRuleRequest:
      allOf:
      - $ref: '#/components/schemas/RuleRequestCommon'
      - type: object
        required:
        - templateKind
        - templateSpec
        properties:
          templateKind:
            type: string
            enum:
            - source_consensus
          templateSpec:
            $ref: '#/components/schemas/SourceConsensusSpec'
    SourceConsensusSpec:
      type: object
      description: |
        Checks that every source holds the asset and that `max(balance) - min(balance)
        <= tolerance`. An absent source fails the check as a missing source. On a tie,
        the first source in spec order is reported as the minimum or the maximum.
      required:
      - sources
      properties:
        sources:
          type: array
          minItems: 2
          maxItems: 32
          items:
            $ref: '#/components/schemas/NamedSource'
          description: Ordered independent records with unique IDs. Every source must declare the same
            asset.
        tolerances:
          $ref: '#/components/schemas/Tolerances'
    SourceID:
      type: string
      pattern: ^[A-Za-z][A-Za-z0-9_-]{0,63}$
      description: Stable machine identifier used by terms, fingerprints, and evidence.
      example: customerBook
    TemplateKind:
      type: string
      description: |
        The template catalogue of v3.0.0. `exchange_rate_bounds`,
        `coverage_ratio_bounds` and `stale_holds` come in later v3 minors.
      enum:
      - balance_bounds
      - balance_equation
      - source_consensus
    Tolerances:
      type: object
      description: |
        Per-asset tolerances, keyed by asset code, in minor units of that asset like every other
        amount: `{"USD/2": "5"}` tolerates 5 cents. An asset without an entry is checked
        exactly, with a tolerance of 0. There is no default: one number cannot mean the same
        amount on assets of different precision or value. Keys are asset codes, never `*`.
      additionalProperties:
        $ref: '#/components/schemas/UnsignedIntegerString'
      maxProperties: 256
      example:
        USD/2: '5'
        EUR/2: '10'
    UnsignedIntegerString:
      type: string
      pattern: ^(0|[1-9][0-9]*)$
      description: A non-negative base-10 integer encoded as a string to avoid JSON precision loss.
      example: '1250'
