# yaml-language-server: $schema=https://goreleaser.com/static/schema-pro.json
version: 2
project_name: reconciliation

includes:
  - from_url:
      url: https://raw.githubusercontent.com/formancehq/earthly/refs/heads/main/.goreleaser.default-v2.yaml

builds:
  - binary: reconciliation
    id: reconciliation
    ldflags:
      - -X github.com/formancehq/reconciliation/cmd.BuildDate={{ .Date }}
      - -X github.com/formancehq/reconciliation/cmd.Version=v{{ .Version }}
      - -X github.com/formancehq/reconciliation/cmd.Commit={{ .ShortCommit }}
      - -extldflags "-static"
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: "{{.ProjectName}}"
    ids:
      - reconciliation
    formats: [tar.gz]
    name_template: "{{.ProjectName}}_{{.Os}}-{{.Arch}}"

release:
  prerelease: auto
  footer: |
    ## What to do next?
    - Read the [documentation](https://docs.formance.com/)
    - Join our [GitHub Discussions](https://github.com/orgs/formancehq/discussions)