openapi: 3.0.3
info:
  title: Reconciliation API
  version: RECONCILIATION_VERSION
paths:
  /_info:
    get:
      summary: Get server info
      operationId: getServerInfo
      tags:
        - reconciliation.v1
      responses:
        '200':
          $ref: '#/components/responses/ServerInfo'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
        - Authorization:
            - reconciliation:read
  /policies:
    post:
      summary: Create a policy
      tags:
        - reconciliation.v1
      operationId: createPolicy
      description: Create a policy
      requestBody:
        $ref: '#/components/requestBodies/Policy'
      responses:
        '201':
          $ref: '#/components/responses/Policy'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
        - Authorization:
            - reconciliation:write
    get:
      summary: List policies
      operationId: listPolicies
      tags:
        - reconciliation.v1
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryBuilder'
      responses:
        '200':
          $ref: '#/components/responses/Policies'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
        - Authorization:
            - reconciliation:read
  /policies/{policyID}:
    delete:
      summary: Delete a policy
      operationId: deletePolicy
      tags:
        - reconciliation.v1
      description: Delete a policy by its id.
      parameters:
        - $ref: '#/components/parameters/PolicyID'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
        - Authorization:
            - reconciliation:write
    get:
      summary: Get a policy
      tags:
        - reconciliation.v1
      operationId: getPolicy
      parameters:
        - $ref: '#/components/parameters/PolicyID'
      responses:
        '200':
          $ref: '#/components/responses/Policy'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
        - Authorization:
            - reconciliation:read
  /policies/{policyID}/reconciliation:
    post:
      summary: Reconcile using a policy
      tags:
        - reconciliation.v1
      operationId: reconcile
      description: Reconcile using a policy
      parameters:
        - $ref: '#/components/parameters/PolicyID'
      requestBody:
        $ref: '#/components/requestBodies/Reconciliation'
      responses:
        '200':
          $ref: '#/components/responses/Reconciliation'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
        - Authorization:
            - reconciliation:write
  /reconciliations:
    get:
      summary: List reconciliations
      operationId: listReconciliations
      tags:
        - reconciliation.v1
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryBuilder'
      responses:
        '200':
          $ref: '#/components/responses/Reconciliations'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
        - Authorization:
            - reconciliation:read
  /reconciliations/{reconciliationID}:
    get:
      summary: Get a reconciliation
      tags:
        - reconciliation.v1
      operationId: getReconciliation
      parameters:
        - $ref: '#/components/parameters/ReconciliationID'
      responses:
        '200':
          $ref: '#/components/responses/Reconciliation'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
        - Authorization:
            - reconciliation:read

  # --- V1 Ledger Clarity surface ---------------------------------------------

  /rules:
    post:
      summary: Create a rule
      operationId: createRule
      tags: [reconciliation.v1]
      requestBody: { $ref: '#/components/requestBodies/Rule' }
      responses:
        '201': { $ref: '#/components/responses/Rule' }
        default: { $ref: '#/components/responses/ErrorResponse' }
      security:
        - Authorization: [reconciliation:write]
    get:
      summary: List rules
      operationId: listRules
      tags: [reconciliation.v1]
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QueryBuilder' }
      responses:
        '200': { $ref: '#/components/responses/Rules' }
        default: { $ref: '#/components/responses/ErrorResponse' }
      security:
        - Authorization: [reconciliation:read]

  /rules/{ruleID}:
    parameters: [{ $ref: '#/components/parameters/RuleID' }]
    get:
      summary: Get a rule
      operationId: getRule
      tags: [reconciliation.v1]
      responses:
        '200': { $ref: '#/components/responses/Rule' }
        default: { $ref: '#/components/responses/ErrorResponse' }
      security:
        - Authorization: [reconciliation:read]
    patch:
      summary: Patch a rule (partial update)
      operationId: patchRule
      tags: [reconciliation.v1]
      requestBody: { $ref: '#/components/requestBodies/RulePatch' }
      responses:
        '200': { $ref: '#/components/responses/Rule' }
        default: { $ref: '#/components/responses/ErrorResponse' }
      security:
        - Authorization: [reconciliation:write]
    delete:
      summary: Delete a rule (cascades to evaluations + incidents)
      operationId: deleteRule
      tags: [reconciliation.v1]
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        default: { $ref: '#/components/responses/ErrorResponse' }
      security:
        - Authorization: [reconciliation:write]

  /rules/{ruleID}/evaluate:
    post:
      summary: Evaluate a rule now
      operationId: evaluateRule
      tags: [reconciliation.v1]
      parameters: [{ $ref: '#/components/parameters/RuleID' }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EvaluateRuleRequest' }
      responses:
        '200': { $ref: '#/components/responses/Evaluation' }
        default: { $ref: '#/components/responses/ErrorResponse' }
      security:
        - Authorization: [reconciliation:write]

  /evaluations:
    get:
      summary: List evaluations
      operationId: listEvaluations
      tags: [reconciliation.v1]
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QueryBuilder' }
      responses:
        '200': { $ref: '#/components/responses/Evaluations' }
        default: { $ref: '#/components/responses/ErrorResponse' }
      security:
        - Authorization: [reconciliation:read]

  /evaluations/{evaluationID}:
    get:
      summary: Get an evaluation
      operationId: getEvaluation
      tags: [reconciliation.v1]
      parameters: [{ $ref: '#/components/parameters/EvaluationID' }]
      responses:
        '200': { $ref: '#/components/responses/Evaluation' }
        default: { $ref: '#/components/responses/ErrorResponse' }
      security:
        - Authorization: [reconciliation:read]

  /incidents:
    get:
      summary: List incidents
      operationId: listIncidents
      tags: [reconciliation.v1]
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QueryBuilder' }
      responses:
        '200': { $ref: '#/components/responses/Incidents' }
        default: { $ref: '#/components/responses/ErrorResponse' }
      security:
        - Authorization: [reconciliation:read]

  /incidents/{incidentID}:
    parameters: [{ $ref: '#/components/parameters/IncidentID' }]
    get:
      summary: Get an incident
      operationId: getIncident
      tags: [reconciliation.v1]
      responses:
        '200': { $ref: '#/components/responses/Incident' }
        default: { $ref: '#/components/responses/ErrorResponse' }
      security:
        - Authorization: [reconciliation:read]

  /incidents/{incidentID}/ack:
    post:
      summary: Acknowledge an incident
      operationId: ackIncident
      tags: [reconciliation.v1]
      parameters: [{ $ref: '#/components/parameters/IncidentID' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AckIncidentRequest' }
      responses:
        '200': { $ref: '#/components/responses/Incident' }
        default: { $ref: '#/components/responses/ErrorResponse' }
      security:
        - Authorization: [reconciliation:write]

  /incidents/{incidentID}/resolve:
    post:
      summary: Resolve an incident (fixed_by_booking)
      operationId: resolveIncident
      tags: [reconciliation.v1]
      parameters: [{ $ref: '#/components/parameters/IncidentID' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResolveIncidentRequest' }
      responses:
        '200': { $ref: '#/components/responses/Incident' }
        default: { $ref: '#/components/responses/ErrorResponse' }
      security:
        - Authorization: [reconciliation:write]

  /incidents/{incidentID}/accept:
    post:
      summary: Accept an incident (accepted_by_business)
      operationId: acceptIncident
      tags: [reconciliation.v1]
      parameters: [{ $ref: '#/components/parameters/IncidentID' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcceptIncidentRequest' }
      responses:
        '200': { $ref: '#/components/responses/Incident' }
        default: { $ref: '#/components/responses/ErrorResponse' }
      security:
        - Authorization: [reconciliation:write]

components:
  parameters:
    PageSize:
      name: pageSize
      in: query
      description: |
        The maximum number of results to return per page.
      example: 100
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 1000
    Cursor:
      name: cursor
      in: query
      description: |
        Parameter used in pagination requests. Maximum page size is set to 15.
        Set to the value of next for the next page of results.
        Set to the value of previous for the previous page of results.
        No other parameters can be set when this parameter is set.
      schema:
        type: string
        example: aHR0cHM6Ly9nLnBhZ2UvTmVrby1SYW1lbj9zaGFyZQ==
    PolicyID:
      name: policyID
      in: path
      schema:
        type: string
      description: The policy ID.
      example: XXX
      required: true
    ReconciliationID:
      name: reconciliationID
      in: path
      schema:
        type: string
      description: The reconciliation ID.
      example: XXX
      required: true
    RuleID:
      name: ruleID
      in: path
      required: true
      description: The rule ID.
      schema: { type: string, format: uuid }
    EvaluationID:
      name: evaluationID
      in: path
      required: true
      description: The evaluation ID.
      schema: { type: string, format: uuid }
    IncidentID:
      name: incidentID
      in: path
      required: true
      description: The incident ID.
      schema: { type: string, format: uuid }
  responses:
    NoContent:
      description: No content
    ServerInfo:
      description: Server information
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ServerInfo'
    Policies:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PoliciesCursorResponse'
    Policy:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PolicyResponse'
    Reconciliations:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReconciliationsCursorResponse'
    Reconciliation:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReconciliationResponse'
    ErrorResponse:
      description: Error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Rule:
      description: OK
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RuleResponse' }
    Rules:
      description: OK
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RulesCursorResponse' }
    Evaluation:
      description: OK
      content:
        application/json:
          schema: { $ref: '#/components/schemas/EvaluationResponse' }
    Evaluations:
      description: OK
      content:
        application/json:
          schema: { $ref: '#/components/schemas/EvaluationsCursorResponse' }
    Incident:
      description: OK
      content:
        application/json:
          schema: { $ref: '#/components/schemas/IncidentResponse' }
    Incidents:
      description: OK
      content:
        application/json:
          schema: { $ref: '#/components/schemas/IncidentsCursorResponse' }
  requestBodies:
    Policy:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PolicyRequest'
    Reconciliation:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReconciliationRequest'
    Rule:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RuleRequest' }
    RulePatch:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RulePatchRequest' }
  schemas:
    QueryBuilder:
      type: object
      additionalProperties: true
    PoliciesCursorResponse:
      type: object
      required:
        - cursor
      properties:
        cursor:
          type: object
          required:
            - pageSize
            - hasMore
            - data
          properties:
            pageSize:
              type: integer
              format: int64
              minimum: 1
              maximum: 1000
              example: 15
            hasMore:
              type: boolean
              example: false
            previous:
              type: string
              example: YXVsdCBhbmQgYSBtYXhpbXVtIG1heF9yZXN1bHRzLol=
            next:
              type: string
              example: ''
            data:
              type: array
              items:
                $ref: '#/components/schemas/Policy'
    ReconciliationsCursorResponse:
      type: object
      required:
        - cursor
      properties:
        cursor:
          type: object
          required:
            - pageSize
            - hasMore
            - data
          properties:
            pageSize:
              type: integer
              format: int64
              minimum: 1
              maximum: 1000
              example: 15
            hasMore:
              type: boolean
              example: false
            previous:
              type: string
              example: YXVsdCBhbmQgYSBtYXhpbXVtIG1heF9yZXN1bHRzLol=
            next:
              type: string
              example: ''
            data:
              type: array
              items:
                $ref: '#/components/schemas/Reconciliation'
    ServerInfo:
      type: object
      required:
        - version
      properties:
        version:
          type: string
    PolicyRequest:
      type: object
      required:
        - name
        - ledgerName
        - ledgerQuery
        - paymentsPoolID
      properties:
        name:
          type: string
          example: XXX
        ledgerName:
          type: string
          example: default
        ledgerQuery:
          type: object
          additionalProperties: true
        paymentsPoolID:
          type: string
          example: XXX
    PolicyResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/Policy'
    ReconciliationRequest:
      type: object
      required:
        - reconciledAtLedger
        - reconciledAtPayments
      properties:
        reconciledAtLedger:
          type: string
          format: date-time
          example: '2021-01-01T00:00:00.000Z'
        reconciledAtPayments:
          type: string
          format: date-time
          example: '2021-01-01T00:00:00.000Z'
    ReconciliationResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/Reconciliation'
    Policy:
      type: object
      required:
        - id
        - name
        - createdAt
        - ledgerName
        - ledgerQuery
        - paymentsPoolID
      properties:
        id:
          type: string
          example: XXX
        name:
          type: string
          example: XXX
        createdAt:
          type: string
          format: date-time
          example: '2021-01-01T00:00:00.000Z'
        ledgerName:
          type: string
          example: default
        ledgerQuery:
          type: object
          additionalProperties: true
        paymentsPoolID:
          type: string
          example: XXX
    Reconciliation:
      type: object
      required:
        - id
        - policyID
        - createdAt
        - reconciledAtLedger
        - reconciledAtPayments
        - status
        - paymentsBalances
        - ledgerBalances
        - driftBalances
      properties:
        id:
          type: string
          example: XXX
        policyID:
          type: string
          example: XXX
        createdAt:
          type: string
          format: date-time
          example: '2021-01-01T00:00:00.000Z'
        reconciledAtLedger:
          type: string
          format: date-time
          example: '2021-01-01T00:00:00.000Z'
        reconciledAtPayments:
          type: string
          format: date-time
          example: '2021-01-01T00:00:00.000Z'
        status:
          type: string
          example: COMPLETED
        paymentsBalances:
          type: object
          additionalProperties:
            type: integer
            format: bigint
        ledgerBalances:
          type: object
          additionalProperties:
            type: integer
            format: bigint
        driftBalances:
          type: object
          additionalProperties:
            type: integer
            format: bigint
        error:
          type: string
    ErrorResponse:
      type: object
      required:
        - errorCode
        - errorMessage
      properties:
        errorCode:
          type: string
          example: VALIDATION
        errorMessage:
          type: string
        details:
          type: string

    # --- V1 Ledger Clarity schemas -----------------------------------------

    Severity:
      type: string
      enum: [info, low, medium, high, critical]
    TemplateKind:
      type: string
      enum: [ledger_vs_pool_drift, ledger_invariant, account_threshold]
    Schedule:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [on_demand, cron] }
        expr: { type: string, example: "*/15 * * * *" }
        tz: { type: string, example: "UTC" }
        safetyMargin: { type: string, example: "30s", description: "Go duration string" }
    Ack:
      type: object
      required: [by, at]
      properties:
        by: { type: string, example: "ops@buildr.com" }
        at: { type: string, format: date-time }
        note: { type: string }
    Resolution:
      type: object
      required: [kind, by, at]
      properties:
        kind: { type: string, enum: [auto, fixed_by_booking, accepted_by_business] }
        by: { type: string }
        at: { type: string, format: date-time }
        note: { type: string }
        transactionRefs:
          type: array
          items: { type: string }
        evidenceSnapshot:
          type: object
          additionalProperties: true
        expiresAt: { type: string, format: date-time }

    Rule:
      type: object
      required: [id, name, templateKind, templateSpec, enabled, severity, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        templateKind: { $ref: '#/components/schemas/TemplateKind' }
        templateSpec:
          type: object
          additionalProperties: true
        compiledCEL: { type: string }
        enabled: { type: boolean }
        severity: { $ref: '#/components/schemas/Severity' }
        schedule: { $ref: '#/components/schemas/Schedule' }
        notifications:
          type: array
          items: { type: string }
        labels:
          type: object
          additionalProperties: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    RuleRequest:
      type: object
      required: [name, templateKind, templateSpec]
      properties:
        name: { type: string }
        templateKind: { $ref: '#/components/schemas/TemplateKind' }
        templateSpec:
          type: object
          additionalProperties: true
        severity: { $ref: '#/components/schemas/Severity' }
        schedule: { $ref: '#/components/schemas/Schedule' }
        notifications:
          type: array
          items: { type: string }
        labels:
          type: object
          additionalProperties: { type: string }
        enabled: { type: boolean }
    RulePatchRequest:
      type: object
      description: Partial update — only fields supplied are applied.
      properties:
        name: { type: string }
        templateKind: { $ref: '#/components/schemas/TemplateKind' }
        templateSpec:
          type: object
          additionalProperties: true
        enabled: { type: boolean }
        severity: { $ref: '#/components/schemas/Severity' }
        schedule: { $ref: '#/components/schemas/Schedule' }
        notifications:
          type: array
          items: { type: string }
        labels:
          type: object
          additionalProperties: { type: string }
    RuleResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Rule' }
    RulesCursorResponse:
      type: object
      required: [cursor]
      properties:
        cursor:
          type: object
          required: [pageSize, hasMore, data]
          properties:
            pageSize: { type: integer, format: int64, minimum: 1, maximum: 1000 }
            hasMore: { type: boolean }
            previous: { type: string }
            next: { type: string }
            data:
              type: array
              items: { $ref: '#/components/schemas/Rule' }

    EvaluateRuleRequest:
      type: object
      properties:
        at: { type: string, format: date-time, description: "PIT for the evaluation. Defaults to now." }
        safetyMargin: { type: string, example: "30s", description: "Go duration string subtracted from `at`. Defaults to 30s." }
    Evaluation:
      type: object
      required: [id, ruleID, startedAt, endedAt, result, createdAt]
      properties:
        id: { type: string, format: uuid }
        ruleID: { type: string, format: uuid }
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time }
        pitPerSource:
          type: object
          additionalProperties: { type: string, format: date-time }
        result: { type: string, enum: [PASS, FAIL, ERROR] }
        evidence:
          oneOf:
            - type: array
              items:
                type: object
                additionalProperties: true
            - type: object
              additionalProperties: true
        error: { type: string }
        costUnits: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
    EvaluationResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Evaluation' }
    EvaluationsCursorResponse:
      type: object
      required: [cursor]
      properties:
        cursor:
          type: object
          required: [pageSize, hasMore, data]
          properties:
            pageSize: { type: integer, format: int64 }
            hasMore: { type: boolean }
            previous: { type: string }
            next: { type: string }
            data:
              type: array
              items: { $ref: '#/components/schemas/Evaluation' }

    Incident:
      type: object
      required: [id, ruleID, fingerprint, status, severity, openedAt, lastSeenAt, occurrenceCount, firstEvaluationID, lastEvaluationID, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        ruleID: { type: string, format: uuid }
        fingerprint: { type: string, example: "asset:USD/2" }
        status: { type: string, enum: [OPEN, ACKNOWLEDGED, RESOLVED] }
        severity: { $ref: '#/components/schemas/Severity' }
        openedAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        occurrenceCount: { type: integer }
        firstEvaluationID: { type: string, format: uuid }
        lastEvaluationID: { type: string, format: uuid }
        evidence:
          type: object
          additionalProperties: true
        ack: { $ref: '#/components/schemas/Ack' }
        resolution: { $ref: '#/components/schemas/Resolution' }
        parentIncidentID: { type: string, format: uuid }
        labels:
          type: object
          additionalProperties: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    IncidentResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Incident' }
    IncidentsCursorResponse:
      type: object
      required: [cursor]
      properties:
        cursor:
          type: object
          required: [pageSize, hasMore, data]
          properties:
            pageSize: { type: integer, format: int64 }
            hasMore: { type: boolean }
            previous: { type: string }
            next: { type: string }
            data:
              type: array
              items: { $ref: '#/components/schemas/Incident' }

    AckIncidentRequest:
      type: object
      required: [by]
      properties:
        by: { type: string, example: "ops@buildr.com" }
        note: { type: string }
    ResolveIncidentRequest:
      type: object
      required: [by]
      description: |
        Mark an incident resolved. When `transactionRefs` is non-empty the
        resolution kind is recorded as `fixed_by_booking`.
      properties:
        by: { type: string }
        note: { type: string }
        transactionRefs:
          type: array
          items: { type: string }
    AcceptIncidentRequest:
      type: object
      required: [by, note]
      description: Business acceptance. `note` is required and the evidence is snapshotted onto the resolution.
      properties:
        by: { type: string }
        note: { type: string, minLength: 1 }
        expiresAt: { type: string, format: date-time }
