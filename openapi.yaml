openapi: 3.0.3
info:
  title: Reconciliation API
  version: RECONCILIATION_VERSION
paths:
  /_info:
    get:
      summary: Get server info
      operationId: getServerInfo
      tags:
        - reconciliation
      responses:
        '200':
          $ref: '#/components/responses/ServerInfo'
        default:
          $ref: '#/components/responses/ErrorResponse'
      # Public discovery endpoint: served outside the auth middleware (like
      # /_healthcheck) so the console shell can probe it to discover this module
      # before it holds a module-scoped token.
      security: []
  /v2/rules:
    post:
      summary: Create a rule
      operationId: createRuleV2
      tags: [reconciliation.v2]
      requestBody: { $ref: '#/components/requestBodies/RuleV2' }
      responses:
        '201': { $ref: '#/components/responses/RuleV2' }
        default: { $ref: '#/components/responses/ErrorResponse' }
      security:
        - Authorization: [reconciliation:write]
    get:
      summary: List V2 rules
      operationId: listRulesV2
      tags: [reconciliation.v2]
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QueryBuilderV2' }
      responses:
        '200': { $ref: '#/components/responses/RulesV2' }
        default: { $ref: '#/components/responses/ErrorResponse' }
      security:
        - Authorization: [reconciliation:read]

  /v2/rules/{ruleID}:
    parameters: [{ $ref: '#/components/parameters/RuleID' }]
    get:
      summary: Get a V2 rule
      operationId: getRuleV2
      tags: [reconciliation.v2]
      responses:
        '200': { $ref: '#/components/responses/RuleV2' }
        default: { $ref: '#/components/responses/ErrorResponse' }
      security:
        - Authorization: [reconciliation:read]
    patch:
      summary: Patch a V2 rule
      description: Changing a V2 operation requires both `templateKind` and its matching typed `templateSpec`.
      operationId: patchRuleV2
      tags: [reconciliation.v2]
      requestBody: { $ref: '#/components/requestBodies/RulePatchV2' }
      responses:
        '200': { $ref: '#/components/responses/RuleV2' }
        default: { $ref: '#/components/responses/ErrorResponse' }
      security:
        - Authorization: [reconciliation:write]
    delete:
      summary: Delete a V2 rule definition while preserving its audit history
      operationId: deleteRuleV2
      tags: [reconciliation.v2]
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        default: { $ref: '#/components/responses/ErrorResponse' }
      security:
        - Authorization: [reconciliation:write]

  /v2/rules/{ruleID}/evaluate:
    post:
      summary: Evaluate a V2 rule now
      operationId: evaluateRuleV2
      tags: [reconciliation.v2]
      parameters: [{ $ref: '#/components/parameters/RuleID' }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EvaluateRuleRequestV2' }
      responses:
        '200': { $ref: '#/components/responses/EvaluationV2' }
        default: { $ref: '#/components/responses/ErrorResponse' }
      security:
        - Authorization: [reconciliation:write]

  /v2/rules/{ruleID}/captures:
    parameters: [{ $ref: '#/components/parameters/RuleID' }]
    get:
      summary: List a V2 rule's immutable evaluation captures
      operationId: listRuleCapturesV2
      tags: [reconciliation.v2]
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
        - name: period
          in: query
          required: false
          description: Scope the history to a single reconciliation period (for example, "2026-03" or "continuous").
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/CapturesV2' }
  # --- Ledger introspection (UI federation) ----------------------------------
  # Read-only helpers the standalone UI's rule builder uses for live ledger-name
  # / metadata-key / account autosuggest, sourced through this module's ledger
  # gRPC connection. Best-effort: an unknown/unreachable ledger yields an empty
  # set and the builder falls back to free-text.
  /ledgers:
    get:
      summary: List ledger names
      description: |
        Live ledger names in the cluster (soft-deleted ledgers are skipped),
        read through this module's ledger gRPC connection. Backs the rule
        builder's ledger picker. Best-effort: an unreachable ledger yields [].
      operationId: listLedgers
      tags: [reconciliation]
      responses:
        '200': { $ref: '#/components/responses/Ledgers' }
        default: { $ref: '#/components/responses/ErrorResponse' }
      security:
        - Authorization: [reconciliation:read]
  /ledgers/{ledger}/meta-fields:
    get:
      summary: List a ledger's indexed account-metadata fields
      description: |
        Indexed account-metadata keys (+ value kind) and account types for a
        data ledger, so the rule builder can offer a typed key picker. An
        unknown ledger yields an empty set.
      operationId: listLedgerMetaFields
      tags: [reconciliation]
      parameters: [{ $ref: '#/components/parameters/Ledger' }]
      responses:
        '200': { $ref: '#/components/responses/LedgerMetaFields' }
        default: { $ref: '#/components/responses/ErrorResponse' }
      security:
        - Authorization: [reconciliation:read]
  /ledgers/{ledger}/accounts:
    get:
      summary: List a ledger's accounts
      description: |
        Accounts (address + per-asset balance) for a data ledger, bounded by
        limit and optionally filtered by an address prefix. Backs the UI's
        account-selector autosuggest. An unknown ledger yields an empty list.
      operationId: listLedgerAccounts
      tags: [reconciliation]
      parameters:
        - $ref: '#/components/parameters/Ledger'
        - name: prefix
          in: query
          description: Restrict to accounts whose address starts with this prefix.
          schema: { type: string }
        - name: limit
          in: query
          description: Maximum accounts to return (default 50, max 500).
          schema: { type: integer, format: int64, minimum: 1, maximum: 500, default: 50 }
      responses:
        '200': { $ref: '#/components/responses/LedgerAccounts' }
        default: { $ref: '#/components/responses/ErrorResponse' }
      security:
        - Authorization: [reconciliation:read]

  /audit/signing-keys:
    get:
      summary: List audit signing keys
      description: |
        The public Ed25519 keys reconciliation signs its control-ledger writes
        with. An external auditor uses the base64 `publicKey` to verify any
        `_recon` entry themselves — `ed25519.Verify(publicKey, payload, signature)`
        — with nobody from Formance in the loop. Backs the audit tab's
        "verify it yourself" panel. Best-effort: an unreachable ledger yields [].
      operationId: listAuditSigningKeys
      tags: [reconciliation]
      responses:
        '200': { $ref: '#/components/responses/SigningKeys' }
        default: { $ref: '#/components/responses/ErrorResponse' }
      security:
        - Authorization: [reconciliation:read]

  /audit/entries:
    get:
      summary: List signed audit entries
      description: |
        Reconciliation's own control-ledger audit entries — the ledger's native
        AuditEntry stream scoped to the control ledger, newest first. Each entry
        carries the exact signed `payload` (the committed batch bytes) and its
        Ed25519 `signature`, so an external auditor verifies any write from the
        published public key — `ed25519.Verify(publicKey, payload, signature)` —
        with no ledger access and nobody from Formance in the loop.

        Note: `sequence` is the ledger's dense, bucket-wide audit sequence, shared
        with any other ledgers in the same bucket; per-entry authenticity is
        absolute, but a gapless subset requires an isolated bucket (see the audit
        docs). Best-effort: an unreachable ledger yields [].
      operationId: listAuditEntries
      tags: [reconciliation]
      parameters:
        - name: limit
          in: query
          description: Maximum entries to return (default 50, max 500).
          schema: { type: integer, format: int64, minimum: 1, maximum: 500, default: 50 }
      responses:
        '200': { $ref: '#/components/responses/AuditEntries' }
        default: { $ref: '#/components/responses/ErrorResponse' }
      security:
        - Authorization: [reconciliation:read]

  /audit/entries/by-transaction/{transactionId}:
    get:
      summary: Resolve a transaction to its signed audit entry
      description: |
        Given a control-ledger transaction id (the `transactionId` an alert event
        carries — which equals the write's log sequence), return the signed audit
        entry for that write. The audit entry's own `sequence` is a different,
        bucket-wide number; this bridges a business action to its cryptographic
        proof. 404 when no entry matches.
      operationId: getAuditEntryByTransaction
      tags: [reconciliation]
      parameters:
        - name: transactionId
          in: path
          required: true
          description: The control-ledger transaction id (log sequence) from an alert event.
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditEntryResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
      security:
        - Authorization: [reconciliation:read]

  /audit/entries/{sequence}:
    get:
      summary: Get one audit entry
      description: |
        One audit entry by sequence, with the detail the list omits — notably the
        failure reason and message on a rejected write. Backs the audit tab's
        expand-a-row interaction.
      operationId: getAuditEntry
      tags: [reconciliation]
      parameters:
        - name: sequence
          in: path
          required: true
          description: The ledger audit sequence number.
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditEntryResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
      security:
        - Authorization: [reconciliation:read]

  /v2/rules/{ruleID}/timeline:
    parameters: [{ $ref: '#/components/parameters/RuleID' }]
    get:
      summary: List the combined lifecycle and observation history for a V2 rule
      operationId: listRuleTimelineV2
      tags: [reconciliation.v2]
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200': { $ref: '#/components/responses/RuleActivities' }
        default: { $ref: '#/components/responses/ErrorResponse' }
      security:
        - Authorization: [reconciliation:read]

  /v2/alerts:
    get:
      summary: List V2 alerts
      operationId: listAlertsV2
      tags: [reconciliation.v2]
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QueryBuilderV2' }
      responses:
        '200': { $ref: '#/components/responses/AlertsV2' }
        default: { $ref: '#/components/responses/ErrorResponse' }
      security:
        - Authorization: [reconciliation:read]

  /v2/alerts/{alertID}:
    parameters: [{ $ref: '#/components/parameters/AlertID' }]
    get:
      summary: Get a V2 alert
      operationId: getAlertV2
      tags: [reconciliation.v2]
      responses:
        '200': { $ref: '#/components/responses/AlertV2' }
        default: { $ref: '#/components/responses/ErrorResponse' }
      security:
        - Authorization: [reconciliation:read]

  /v2/alerts/{alertID}/events:
    parameters: [{ $ref: '#/components/parameters/AlertID' }]
    get:
      summary: List V2 alert events (append-only timeline)
      operationId: listAlertEventsV2
      description: |
        Same as the V1 alert-events endpoint, for a V2 alert: a page of the
        events recorded for this alert (evaluations + manual transitions),
        most-recent-first and cursor-paginated. Each event carries the
        `transactionId` of its control-ledger write for audit-chain resolution.
      tags: [reconciliation.v2]
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200': { $ref: '#/components/responses/AlertEvents' }
        default: { $ref: '#/components/responses/ErrorResponse' }
      security:
        - Authorization: [reconciliation:read]

  /v2/alerts/{alertID}/ack:
    post:
      summary: Acknowledge a V2 alert
      operationId: ackAlertV2
      tags: [reconciliation.v2]
      parameters: [{ $ref: '#/components/parameters/AlertID' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AckAlertRequestV2' }
      responses:
        '200': { $ref: '#/components/responses/AlertV2' }
        default: { $ref: '#/components/responses/ErrorResponse' }
      security:
        - Authorization: [reconciliation:write]

  /v2/alerts/{alertID}/resolve:
    post:
      summary: Resolve a V2 alert (fixed_by_booking)
      operationId: resolveAlertV2
      tags: [reconciliation.v2]
      parameters: [{ $ref: '#/components/parameters/AlertID' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResolveAlertRequestV2' }
      responses:
        '200': { $ref: '#/components/responses/AlertV2' }
        default: { $ref: '#/components/responses/ErrorResponse' }
      security:
        - Authorization: [reconciliation:write]

  /v2/alerts/{alertID}/accept:
    post:
      summary: Accept a V2 alert (accepted_by_business)
      operationId: acceptAlertV2
      tags: [reconciliation.v2]
      parameters: [{ $ref: '#/components/parameters/AlertID' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcceptAlertRequestV2' }
      responses:
        '200': { $ref: '#/components/responses/AlertV2' }
        default: { $ref: '#/components/responses/ErrorResponse' }
      security:
        - Authorization: [reconciliation:write]

  /v2/alerts/{alertID}/snooze:
    post:
      summary: Snooze a V2 alert's notifications until a future instant
      operationId: snoozeAlertV2
      tags: [reconciliation.v2]
      parameters: [{ $ref: '#/components/parameters/AlertID' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SnoozeAlertRequestV2' }
      responses:
        '200': { $ref: '#/components/responses/AlertV2' }
        default: { $ref: '#/components/responses/ErrorResponse' }
      security:
        - Authorization: [reconciliation:write]

  /v2/alerts/{alertID}/unsnooze:
    post:
      summary: Lift a V2 alert snooze early
      operationId: unsnoozeAlertV2
      tags: [reconciliation.v2]
      parameters: [{ $ref: '#/components/parameters/AlertID' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UnsnoozeAlertRequestV2' }
      responses:
        '200': { $ref: '#/components/responses/AlertV2' }
        default: { $ref: '#/components/responses/ErrorResponse' }
      security:
        - Authorization: [reconciliation:write]

components:
  parameters:
    PageSize:
      name: pageSize
      in: query
      description: |
        The maximum number of results to return per page.
      example: 100
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 1000
    Cursor:
      name: cursor
      in: query
      description: |
        Parameter used in pagination requests. Maximum page size is set to 15.
        Set to the value of next for the next page of results.
        Set to the value of previous for the previous page of results.
        No other parameters can be set when this parameter is set.
      schema:
        type: string
        example: aHR0cHM6Ly9nLnBhZ2UvTmVrby1SYW1lbj9zaGFyZQ==
    RuleID:
      name: ruleID
      in: path
      required: true
      description: The rule ID.
      schema: { type: string, format: uuid }
    AlertID:
      name: alertID
      in: path
      required: true
      description: The alert ID.
      schema: { type: string, format: uuid }
    Ledger:
      name: ledger
      in: path
      required: true
      description: The data ledger name.
      schema: { type: string }
  responses:
    NoContent:
      description: No content
    ServerInfo:
      description: Server information
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ServerInfo'
    ErrorResponse:
      description: Error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    AlertEvents:
      description: OK
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AlertEventsCursorResponse' }
    RuleActivities:
      description: OK
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RuleActivitiesCursorResponse' }
    RuleV2:
      description: OK
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RuleResponseV2' }
    RulesV2:
      description: OK
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RulesCursorResponseV2' }
    EvaluationV2:
      description: OK
      content:
        application/json:
          schema: { $ref: '#/components/schemas/EvaluationResponseV2' }
    AlertV2:
      description: OK
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AlertResponseV2' }
    AlertsV2:
      description: OK
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AlertsCursorResponseV2' }
    CapturesV2:
      description: OK
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CapturesCursorResponseV2' }
    Ledgers:
      description: OK
      content:
        application/json:
          schema: { $ref: '#/components/schemas/LedgersResponse' }
    SigningKeys:
      description: OK
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SigningKeysResponse' }
    AuditEntries:
      description: OK
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AuditEntriesResponse' }
    LedgerMetaFields:
      description: OK
      content:
        application/json:
          schema: { $ref: '#/components/schemas/LedgerMetaFieldsResponse' }
    LedgerAccounts:
      description: OK
      content:
        application/json:
          schema: { $ref: '#/components/schemas/LedgerAccountsResponse' }
  requestBodies:
    RuleV2:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RuleRequestV2' }
    RulePatchV2:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RulePatchRequestV2' }
  schemas:
    ServerInfo:
      type: object
      required:
        - version
      properties:
        version:
          type: string
    ErrorResponse:
      type: object
      required:
        - errorCode
        - errorMessage
      properties:
        errorCode:
          type: string
          example: VALIDATION
        errorMessage:
          type: string
        details:
          type: string

    # --- Ledger introspection schemas (UI federation) ----------------------

    LedgersResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [ledgers]
          properties:
            ledgers:
              type: array
              items:
                type: object
                required: [name]
                properties:
                  name: { type: string }
    SigningKeysResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [keys]
          properties:
            keys:
              type: array
              items:
                type: object
                required: [keyId, publicKey]
                properties:
                  keyId:
                    type: string
                    description: Short fingerprint identifying the key.
                    example: "6d00a939e0c68f7a"
                  publicKey:
                    type: string
                    description: The Ed25519 public key, standard base64 — feed this to ed25519.Verify.
                    example: "Qqrq1yzuqflCPygUQMbPrHpfmbeWuBhi9FIyiXKyG2E="
                  parentKeyId:
                    type: string
                    description: For a rotated key, the id of the key it descends from.
    AuditEntry:
      type: object
      required: [sequence, signed, outcome]
      properties:
        sequence:
          type: integer
          format: int64
          description: The ledger's dense, bucket-wide audit sequence number.
        timestamp: { type: string, format: date-time }
        keyId:
          type: string
          description: The signing key this entry was signed with (matches /audit/signing-keys).
        payload:
          type: string
          description: The signed batch bytes, standard base64 — the `payload` for ed25519.Verify.
        signature:
          type: string
          description: The Ed25519 signature over `payload`, standard base64.
        signed:
          type: boolean
          description: False for a rare unsigned bootstrap write (e.g. the signing-key registration).
        outcome:
          type: string
          enum: [success, failure]
          description: Whether the batch applied; a failed attempt is still signed and audited.
        orderCount: { type: integer, format: int64 }
        ledgers:
          type: array
          items: { type: string }
        failureReason:
          type: string
          description: Populated for outcome=failure — a readable label for why the ledger rejected the write. Full detail is populated on GET /audit/entries/{sequence}.
        failureMessage:
          type: string
          description: Populated for outcome=failure — the ledger's human-readable rejection message.
        actions:
          type: array
          description: >-
            Decoded per-order business intent (kind of write, target ledger, and a
            cheap identifier where the order carries one). Populated only on GET
            /audit/entries/{sequence}; an Apply batch is reported as one action
            without decoding its numscript.
          items: { $ref: '#/components/schemas/AuditAction' }
    AuditAction:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          description: Short human label, e.g. "Apply batch", "Register numscript".
        ledger:
          type: string
          description: Target ledger for a ledger-scoped order; empty for system-scoped orders.
        detail:
          type: string
          description: An identifier the order carries cheaply, e.g. a numscript "name v2.0.0".
    AuditEntriesResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [entries]
          properties:
            entries:
              type: array
              items: { $ref: '#/components/schemas/AuditEntry' }
    AuditEntryResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/AuditEntry' }
    LedgerMetaFieldsResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [fields, accountTypes, addressIndexed]
          properties:
            fields:
              type: array
              items:
                type: object
                required: [key, kind, ready]
                properties:
                  key: { type: string }
                  kind:
                    type: string
                    enum: [string, int, uint, bool, datetime]
                  ready: { type: boolean }
            accountTypes:
              type: array
              items:
                type: object
                required: [name]
                properties:
                  name: { type: string }
                  pattern: { type: string }
            addressIndexed: { type: boolean }
    LedgerAccountsResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [accounts]
          properties:
            accounts:
              type: array
              items:
                type: object
                required: [address, balances]
                properties:
                  address: { type: string }
                  balances:
                    type: object
                    additionalProperties: { type: string }
            capped: { type: boolean }

    # --- V1 Ledger Clarity schemas -----------------------------------------

    AlertEvent:
      type: object
      description: |
        One row of the alert's append-only event log. Captures every
        evaluation that touched the alert plus every manual transition
        (ack / resolve / accept / snooze / unsnooze). `prevStatus` is null
        only for the inaugural event of an alert. `isReopen` is a derived
        predicate — true when a FAIL event lands on a previously-RESOLVED alert.
        `notify` is the notification decision recorded for the row: false marks
        a transition kept for audit but deliberately not published (a repeated
        identical fail, or a fail muted by an active snooze).
      required: [id, alertID, type, newStatus, at, isReopen, notify]
      properties:
        id: { type: string, format: uuid }
        alertID: { type: string, format: uuid }
        evaluationID: { type: string, format: uuid, nullable: true }
        type: { type: string, enum: [fail, pass, ack, resolve, accept, snooze, unsnooze] }
        prevStatus: { type: string, enum: [OPEN, ACKNOWLEDGED, RESOLVED], nullable: true }
        newStatus: { type: string, enum: [OPEN, ACKNOWLEDGED, RESOLVED] }
        payload:
          description: Event-type-specific payload (evidence for fail, resolution for resolve/accept, ack object for ack, snooze object for snooze).
          type: object
          additionalProperties: true
        at: { type: string, format: date-time }
        isReopen: { type: boolean }
        notify: { type: boolean, description: "Whether this transition was published to the message bus. false = recorded for audit but suppressed." }
        transactionId:
          type: string
          description: >-
            The control-ledger transaction id of the write that recorded this
            event — the identifier of the exact ledger write behind the
            transition. That write is covered by the ledger's signed audit chain,
            so an auditor with the ledger can locate and verify it. Note this is
            the transaction id, not the bucket-wide audit sequence that indexes
            GET /audit/entries.
    AlertEventsCursorResponse:
      type: object
      required: [cursor]
      properties:
        cursor:
          type: object
          required: [pageSize, hasMore, data]
          properties:
            pageSize: { type: integer, format: int64 }
            hasMore: { type: boolean }
            previous: { type: string }
            next: { type: string }
            data:
              type: array
              items: { $ref: '#/components/schemas/AlertEvent' }

    RuleActivity:
      type: object
      required: [id, sequence, kind, category, ruleID, contractVersion, occurredAt, recordedAt]
      properties:
        id: { type: string, example: "8941:0" }
        sequence: { type: string, description: Ledger-local ordering key represented as a string for JavaScript safety. }
        kind:
          type: string
          enum: [rule.created, rule.updated, rule.deleted, evaluation.completed, alert.opened, alert.occurred, alert.reopened, alert.acknowledged, alert.resolved, alert.accepted, alert.auto_resolved, alert.snoozed, alert.unsnoozed]
        category: { type: string, enum: [rule, evaluation, alert] }
        ruleID: { type: string, format: uuid }
        contractVersion: { type: integer, enum: [1, 2] }
        ruleRevision: { type: string }
        correlationID: { type: string, description: Evaluation ID for evaluation-driven activity. }
        occurredAt: { type: string, format: date-time }
        recordedAt: { type: string, format: date-time }
        payload:
          type: object
          additionalProperties: true
    RuleActivitiesCursorResponse:
      type: object
      required: [cursor]
      properties:
        cursor:
          type: object
          required: [pageSize, hasMore, data]
          properties:
            pageSize: { type: integer, format: int64 }
            hasMore: { type: boolean }
            previous: { type: string }
            next: { type: string }
            data:
              type: array
              items: { $ref: '#/components/schemas/RuleActivity' }

    QueryBuilderV2:
      type: object
      additionalProperties: true
    ContractVersionV2:
      type: integer
      format: int32
      enum: [2]
      readOnly: true
    TemplateKindV2:
      type: string
      description: |
        The template catalogue. Every kind uses the named-source model: stable
        source IDs and one declared asset each, or `*` to fan out per asset.
        The positional V1 kinds (`ledger_invariant`, `account_threshold`,
        `source_parity`) were retired once `balance_bounds` gave the last of them
        a target; see the ADR-004 amendment.
      enum: [balance_equation, exchange_rate_bounds, source_consensus, coverage_ratio_bounds, stale_holds, balance_bounds]
    SeverityV2:
      type: string
      enum: [info, low, medium, high, critical]
    PeriodTypeV2:
      type: string
      enum: [continuous, daily, weekly, monthly]
      default: continuous
    ScheduleV2:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [on_demand, cron] }
        expr: { type: string, example: "*/15 * * * *" }
        tz: { type: string, example: "UTC" }

    UnsignedIntegerStringV2:
      type: string
      pattern: '^(0|[1-9][0-9]*)$'
      description: A non-negative base-10 integer encoded as a string to avoid JSON precision loss.
      example: "1250"
    SignedIntegerStringV2:
      type: string
      pattern: '^-?(0|[1-9][0-9]*)$'
      description: A signed base-10 integer encoded as a string to avoid JSON precision loss.
      example: "-1250"
    PositiveDecimalStringV2:
      type: string
      pattern: '^(0|[1-9][0-9]*)(\.[0-9]{1,18})?$'
      description: A positive plain-decimal value with at most 18 fractional digits; signs and exponent notation are rejected.
      example: "1.10"
    AssetV2:
      type: string
      minLength: 1
      description: |
        Ledger asset code including precision, for example `USD/2`.

        `*` declares the source as **every asset the account set holds**, and the
        operation fans out to one outcome per asset — the shape a V1 rule with a
        per-asset tolerance map has always had. Alignment is by exact asset code,
        and a spec must be wholly `*` or wholly named: mixing them has no defined
        alignment and is rejected. Not accepted on an `account_metadata` source
        (its key represents one declared asset) or by `exchange_rate_bounds`
        (a rate is a statement about one named pair).
      example: USD/2
    SourceIDV2:
      type: string
      pattern: '^[A-Za-z][A-Za-z0-9_-]{0,63}$'
      description: Stable machine identifier used by terms, fingerprints, and evidence.
      example: customerBook

    LedgerNamedSourceV2:
      type: object
      required: [id, ledger, query, asset]
      properties:
        id: { $ref: '#/components/schemas/SourceIDV2' }
        label: { type: string }
        kind:
          type: string
          enum: [ledger]
          default: ledger
        ledger: { type: string, minLength: 1 }
        query:
          type: object
          additionalProperties: true
        asset: { $ref: '#/components/schemas/AssetV2' }
    AccountMetadataNamedSourceV2:
      type: object
      required: [id, kind, ledger, query, metadataKey, asset]
      properties:
        id: { $ref: '#/components/schemas/SourceIDV2' }
        label: { type: string }
        kind: { type: string, enum: [account_metadata] }
        ledger: { type: string, minLength: 1 }
        query:
          type: object
          additionalProperties: true
        metadataKey:
          type: string
          minLength: 1
          description: Opaque metadata key; the asset is declared independently.
        asset: { $ref: '#/components/schemas/AssetV2' }
    NamedSourceV2:
      oneOf:
        - $ref: '#/components/schemas/LedgerNamedSourceV2'
        - $ref: '#/components/schemas/AccountMetadataNamedSourceV2'
      discriminator:
        propertyName: kind
        mapping:
          ledger: '#/components/schemas/LedgerNamedSourceV2'
          account_metadata: '#/components/schemas/AccountMetadataNamedSourceV2'

    BalanceEquationTermV2:
      type: object
      required: [source, coefficient]
      properties:
        source: { $ref: '#/components/schemas/SourceIDV2' }
        coefficient:
          description: Non-zero signed integer coefficient for this source.
          oneOf:
            - { type: integer, format: int64, maximum: -1 }
            - { type: integer, format: int64, minimum: 1 }
    BalanceEquationSpecV2:
      type: object
      description: Checks `abs(sum(coefficient * balance)) <= tolerance` for sources declaring the same asset.
      required: [sources, terms, tolerance]
      properties:
        sources:
          type: array
          minItems: 2
          maxItems: 32
          items: { $ref: '#/components/schemas/NamedSourceV2' }
          description: Ordered sources with unique IDs. Every source must declare the same asset.
        terms:
          type: array
          minItems: 2
          maxItems: 32
          items: { $ref: '#/components/schemas/BalanceEquationTermV2' }
          description: Each source ID must be referenced exactly once.
        tolerance: { $ref: '#/components/schemas/UnsignedIntegerStringV2' }
    ExplicitRateBoundsV2:
      type: object
      required: [min, max]
      properties:
        min: { $ref: '#/components/schemas/PositiveDecimalStringV2' }
        max: { $ref: '#/components/schemas/PositiveDecimalStringV2' }
      description: Inclusive positive lower and upper exchange-rate bounds; min must not exceed max.
    TargetRateBoundsV2:
      type: object
      required: [target, toleranceBps]
      properties:
        target: { $ref: '#/components/schemas/PositiveDecimalStringV2' }
        toleranceBps:
          type: integer
          format: int32
          minimum: 0
          maximum: 10000
      description: Inclusive bounds derived exactly from target plus or minus the basis-point tolerance.
    ExchangeRateV2:
      oneOf:
        - $ref: '#/components/schemas/ExplicitRateBoundsV2'
        - $ref: '#/components/schemas/TargetRateBoundsV2'
    ExchangeRateBoundsSpecV2:
      type: object
      description: Checks the exact signed quote-major-units per base-major-unit rate using integer cross-multiplication.
      required: [sources, baseSource, quoteSource, rate]
      properties:
        sources:
          type: array
          minItems: 2
          maxItems: 2
          items: { $ref: '#/components/schemas/NamedSourceV2' }
          description: Exactly two ordered sources with unique IDs.
        baseSource: { $ref: '#/components/schemas/SourceIDV2' }
        quoteSource: { $ref: '#/components/schemas/SourceIDV2' }
        rate: { $ref: '#/components/schemas/ExchangeRateV2' }
    SourceConsensusSpecV2:
      type: object
      description: Checks that every source is present and `max(balance) - min(balance) <= tolerance` for one shared asset.
      required: [sources, tolerance]
      properties:
        sources:
          type: array
          minItems: 2
          maxItems: 32
          items: { $ref: '#/components/schemas/NamedSourceV2' }
          description: Ordered independent records with unique IDs. Every source must declare the same asset.
        tolerance: { $ref: '#/components/schemas/UnsignedIntegerStringV2' }
    CoverageRatioBoundsSpecV2:
      type: object
      description: Checks the exact ratio of two signed, same-asset portfolios against inclusive bounds.
      required: [sources, numeratorTerms, denominatorTerms, ratio]
      properties:
        sources:
          type: array
          minItems: 2
          maxItems: 32
          items: { $ref: '#/components/schemas/NamedSourceV2' }
          description: Every source must declare the same asset and be assigned exactly once across the two portfolios.
        numeratorTerms:
          type: array
          minItems: 1
          maxItems: 31
          items: { $ref: '#/components/schemas/BalanceEquationTermV2' }
        denominatorTerms:
          type: array
          minItems: 1
          maxItems: 31
          items: { $ref: '#/components/schemas/BalanceEquationTermV2' }
        ratio: { $ref: '#/components/schemas/ExchangeRateV2' }

    BalanceBoundV2:
      type: object
      description: |
        One asset's inclusive limits, in that asset's minor units. Either side may
        be omitted, which means **unbounded on that side** — not zero. At least
        one must be set. `min == max` is legal and means exact equality. Both are
        signed: a threshold on a liability or obligation set is negative.
      properties:
        min: { $ref: '#/components/schemas/SignedIntegerStringV2' }
        max: { $ref: '#/components/schemas/SignedIntegerStringV2' }
    BalanceBoundsSpecV2:
      type: object
      description: |
        Asserts that one named source's balance stays inside inclusive per-asset
        limits. It replaced the retired `account_threshold` template.

        Its asset universe is **declared, not discovered**: the keys of `bounds`
        are exactly the assets checked. This is the one V2 template that works
        that way, and it is deliberate — every other template builds its universe
        from the assets its sources actually hold, so an asset that drains to
        nothing leaves the universe and its outcome disappears. For a floor that
        is precisely backwards: a minimum on a set that has drained to zero is
        the alert that matters most, so it must keep failing rather than vanish.

        A source naming one asset must bound exactly that asset; declare
        `asset: "*"` on the source to bound several.
      required: [source, bounds]
      properties:
        source:
          allOf:
            - $ref: '#/components/schemas/NamedSourceV2'
          description: The account set whose balance is bounded. `account_metadata` sources are accepted.
        bounds:
          type: object
          minProperties: 1
          maxProperties: 256
          additionalProperties: { $ref: '#/components/schemas/BalanceBoundV2' }
          description: |
            Inclusive limits keyed by asset code — and the declared asset
            universe. An asset named here that the source does not hold is
            checked as an explicit zero. An asset the source holds that is not
            named here is not checked. `*` is not accepted as a key: a bound is
            denominated.
          example:
            USD/2: { min: "100000", max: "5000000" }
            EUR/2: { min: "50000" }

    HoldDeadlineV2:
      type: object
      description: |
        Where a hold's deadline comes from. Declare `expiryKey` for an expiry
        recorded on the hold, `createdKey` + `maxAge` for an age-based
        fallback, or both — the expiry then wins for every hold that carries
        one, and the fallback covers the rest.
      properties:
        expiryKey:
          type: string
          minLength: 1
          description: Account metadata key holding the instant the hold expires.
          example: hold_expires_at
        createdKey:
          type: string
          minLength: 1
          description: Account metadata key holding the instant the hold was placed.
          example: hold_created_at
        maxAge:
          type: string
          description: |
            How long a hold may live once created, as a Go duration ("48h",
            "90m"). Required with `createdKey`, and rejected without it.
          example: 48h
        encoding:
          type: string
          enum: [datetime, epoch_seconds, epoch_millis, epoch_micros]
          default: datetime
          description: |
            How the deadline keys are written. `datetime` is a key the ledger
            declares as a datetime; the `epoch_*` encodings are integer keys in
            the named unit. Epoch nanoseconds are not supported — query values
            travel as JSON numbers and are rejected past 2^53.
    StaleHoldsSpecV2:
      type: object
      description: |
        Flags held funds whose deadline has passed (`mode: stale`) or is about to
        (`mode: approaching`). A hold is one ledger account with a non-zero
        balance and a deadline in its metadata; released holds — zero balance,
        metadata retained — are ignored. The deadline predicate is pushed into
        the ledger query, so a rule's cost scales with the number of stale holds
        rather than the number of holds. Severity is declared per rule, so
        "warn early, page late" is two rules: an `approaching` rule at a low
        severity and a `stale` rule at a high one.
      required: [source, deadline]
      properties:
        source:
          allOf:
            - $ref: '#/components/schemas/LedgerNamedSourceV2'
          description: The hold universe — one ledger account set, one asset. Metadata sources are not accepted.
        deadline: { $ref: '#/components/schemas/HoldDeadlineV2' }
        mode:
          type: string
          enum: [stale, approaching]
          default: stale
          description: |
            `stale` flags holds whose deadline has passed. `approaching` flags
            the warning *band* — `now < deadline <= now + warnWithin` — so a
            hold crossing into stale leaves this rule and its warning alert
            auto-resolves as the stale rule's alert opens.
        warnWithin:
          type: string
          description: |
            How far ahead to warn, as a Go duration. Required with
            `mode: approaching`, rejected otherwise. Set it longer than the
            rule's evaluation interval, or a hold can cross the band between
            two runs without ever warning.
          example: 6h
        scope:
          type: string
          enum: [per_hold, aggregate]
          default: per_hold
          description: |
            `per_hold` opens one alert per stuck hold, each auto-resolving when
            that hold clears. `aggregate` opens one alert per asset carrying the
            count and the total amount trapped.
        maxHoldsScanned:
          type: integer
          minimum: 1
          description: |
            Caps how many hold accounts one evaluation reads, below the
            engine-wide accounts budget. It bounds the **read**, not the number
            of alerts — though in `per_hold` scope the alert count follows the
            matched set, so it bounds the blast radius of a systemic failure.
            Exceeding it fails the evaluation (recorded as ERROR, with an
            engine-health alert) instead of truncating: a truncated outcome list
            would auto-resolve the holds it dropped. It never raises the
            engine's own budget.

            Defaults: `per_hold` scope caps itself at **1000** — in that scope
            every matched hold can become an alert, so it does not inherit a
            limit sized to protect the ledger rather than the operator. Set this
            explicitly for a rule that legitimately watches more. `aggregate`
            scope emits one outcome however large the set, so it keeps the
            engine's budget.
          example: 500
        identityKeys:
          type: array
          maxItems: 8
          items: { type: string, minLength: 1 }
          description: |
            Account-metadata keys copied into each flagged hold's evidence, so an
            alert names the hold in business terms — the reference, the customer,
            the counterparty — rather than only a ledger address. These are
            labels, not predicates: they are read from the account already
            fetched, need no metadata index, and a key a hold does not carry is
            omitted from its evidence rather than failing it. Alert evidence is
            durable and widely readable, so keep personal data out of it.
          example: [hold_reference, customer_id]

    RuleRequestCommonV2:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        severity: { $ref: '#/components/schemas/SeverityV2' }
        periodType: { $ref: '#/components/schemas/PeriodTypeV2' }
        schedule: { $ref: '#/components/schemas/ScheduleV2' }
        notifications:
          type: array
