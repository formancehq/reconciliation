openapi: 3.0.3
info:
  title: Reconciliation API
  version: RECONCILIATION_VERSION
paths:
  /_info:
    get:
      summary: Get server info
      operationId: getServerInfo
      tags:
        - reconciliation.v1
      responses:
        '200':
          $ref: '#/components/responses/ServerInfo'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
        - Authorization:
            - reconciliation:read
  /policies:
    post:
      summary: Create a policy
      tags:
        - reconciliation.v1
      operationId: createPolicy
      description: Create a policy
      requestBody:
        $ref: '#/components/requestBodies/Policy'
      responses:
        '201':
          $ref: '#/components/responses/Policy'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
        - Authorization:
            - reconciliation:write
    get:
      summary: List policies
      operationId: listPolicies
      tags:
        - reconciliation.v1
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryBuilder'
      responses:
        '200':
          $ref: '#/components/responses/Policies'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
        - Authorization:
            - reconciliation:read
  /policies/{policyID}:
    delete:
      summary: Delete a policy
      operationId: deletePolicy
      tags:
        - reconciliation.v1
      description: Delete a policy by its id.
      parameters:
        - $ref: '#/components/parameters/PolicyID'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
        - Authorization:
            - reconciliation:write
    get:
      summary: Get a policy
      tags:
        - reconciliation.v1
      operationId: getPolicy
      parameters:
        - $ref: '#/components/parameters/PolicyID'
      responses:
        '200':
          $ref: '#/components/responses/Policy'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
        - Authorization:
            - reconciliation:read
  /policies/{policyID}/reconciliation:
    post:
      summary: Reconcile using a policy
      tags:
        - reconciliation.v1
      operationId: reconcile
      description: Reconcile using a policy
      parameters:
        - $ref: '#/components/parameters/PolicyID'
      requestBody:
        $ref: '#/components/requestBodies/Reconciliation'
      responses:
        '200':
          $ref: '#/components/responses/Reconciliation'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
        - Authorization:
            - reconciliation:write
  /reconciliations:
    get:
      summary: List reconciliations
      operationId: listReconciliations
      tags:
        - reconciliation.v1
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryBuilder'
      responses:
        '200':
          $ref: '#/components/responses/Reconciliations'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
        - Authorization:
            - reconciliation:read
  /reconciliations/{reconciliationID}:
    get:
      summary: Get a reconciliation
      tags:
        - reconciliation.v1
      operationId: getReconciliation
      parameters:
        - $ref: '#/components/parameters/ReconciliationID'
      responses:
        '200':
          $ref: '#/components/responses/Reconciliation'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
        - Authorization:
            - reconciliation:read

  # --- V1 Ledger Clarity surface ---------------------------------------------

  /rules:
    post:
      summary: Create a rule
      operationId: createRule
      tags: [reconciliation.v1]
      requestBody: { $ref: '#/components/requestBodies/Rule' }
      responses:
        '201': { $ref: '#/components/responses/Rule' }
        default: { $ref: '#/components/responses/ErrorResponse' }
      security:
        - Authorization: [reconciliation:write]
    get:
      summary: List rules
      operationId: listRules
      tags: [reconciliation.v1]
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QueryBuilder' }
      responses:
        '200': { $ref: '#/components/responses/Rules' }
        default: { $ref: '#/components/responses/ErrorResponse' }
      security:
        - Authorization: [reconciliation:read]

  /rules/{ruleID}:
    parameters: [{ $ref: '#/components/parameters/RuleID' }]
    get:
      summary: Get a rule
      operationId: getRule
      tags: [reconciliation.v1]
      responses:
        '200': { $ref: '#/components/responses/Rule' }
        default: { $ref: '#/components/responses/ErrorResponse' }
      security:
        - Authorization: [reconciliation:read]
    patch:
      summary: Patch a rule (partial update)
      operationId: patchRule
      tags: [reconciliation.v1]
      requestBody: { $ref: '#/components/requestBodies/RulePatch' }
      responses:
        '200': { $ref: '#/components/responses/Rule' }
        default: { $ref: '#/components/responses/ErrorResponse' }
      security:
        - Authorization: [reconciliation:write]
    delete:
      summary: Delete a rule (cascades to evaluations + alerts + alert events)
      operationId: deleteRule
      tags: [reconciliation.v1]
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        default: { $ref: '#/components/responses/ErrorResponse' }
      security:
        - Authorization: [reconciliation:write]

  /rules/{ruleID}/evaluate:
    post:
      summary: Evaluate a rule now
      operationId: evaluateRule
      tags: [reconciliation.v1]
      parameters: [{ $ref: '#/components/parameters/RuleID' }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EvaluateRuleRequest' }
      responses:
        '200': { $ref: '#/components/responses/Evaluation' }
        default: { $ref: '#/components/responses/ErrorResponse' }
      security:
        - Authorization: [reconciliation:write]

  /evaluations:
    get:
      summary: List evaluations
      operationId: listEvaluations
      tags: [reconciliation.v1]
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QueryBuilder' }
      responses:
        '200': { $ref: '#/components/responses/Evaluations' }
        default: { $ref: '#/components/responses/ErrorResponse' }
      security:
        - Authorization: [reconciliation:read]

  /evaluations/{evaluationID}:
    get:
      summary: Get an evaluation
      operationId: getEvaluation
      tags: [reconciliation.v1]
      parameters: [{ $ref: '#/components/parameters/EvaluationID' }]
      responses:
        '200': { $ref: '#/components/responses/Evaluation' }
        default: { $ref: '#/components/responses/ErrorResponse' }
      security:
        - Authorization: [reconciliation:read]

  /alerts:
    get:
      summary: List alerts
      operationId: listAlerts
      tags: [reconciliation.v1]
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QueryBuilder' }
      responses:
        '200': { $ref: '#/components/responses/Alerts' }
        default: { $ref: '#/components/responses/ErrorResponse' }
      security:
        - Authorization: [reconciliation:read]

  /alerts/{alertID}:
    parameters: [{ $ref: '#/components/parameters/AlertID' }]
    get:
      summary: Get an alert
      operationId: getAlert
      tags: [reconciliation.v1]
      responses:
        '200': { $ref: '#/components/responses/Alert' }
        default: { $ref: '#/components/responses/ErrorResponse' }
      security:
        - Authorization: [reconciliation:read]

  /alerts/{alertID}/events:
    parameters: [{ $ref: '#/components/parameters/AlertID' }]
    get:
      summary: List alert events (append-only timeline)
      operationId: listAlertEvents
      description: |
        Returns every event recorded for this alert — every evaluation that
        touched it plus every manual transition. The list is append-only;
        events are never modified or deleted. Ordered most-recent-first.
      tags: [reconciliation.v1]
      responses:
        '200': { $ref: '#/components/responses/AlertEvents' }
        default: { $ref: '#/components/responses/ErrorResponse' }
      security:
        - Authorization: [reconciliation:read]

  /alerts/{alertID}/ack:
    post:
      summary: Acknowledge an alert
      operationId: ackAlert
      tags: [reconciliation.v1]
      parameters: [{ $ref: '#/components/parameters/AlertID' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AckAlertRequest' }
      responses:
        '200': { $ref: '#/components/responses/Alert' }
        default: { $ref: '#/components/responses/ErrorResponse' }
      security:
        - Authorization: [reconciliation:write]

  /alerts/{alertID}/resolve:
    post:
      summary: Resolve an alert (fixed_by_booking)
      operationId: resolveAlert
      tags: [reconciliation.v1]
      parameters: [{ $ref: '#/components/parameters/AlertID' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResolveAlertRequest' }
      responses:
        '200': { $ref: '#/components/responses/Alert' }
        default: { $ref: '#/components/responses/ErrorResponse' }
      security:
        - Authorization: [reconciliation:write]

  /alerts/{alertID}/accept:
    post:
      summary: Accept an alert (accepted_by_business)
      operationId: acceptAlert
      tags: [reconciliation.v1]
      parameters: [{ $ref: '#/components/parameters/AlertID' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcceptAlertRequest' }
      responses:
        '200': { $ref: '#/components/responses/Alert' }
        default: { $ref: '#/components/responses/ErrorResponse' }
      security:
        - Authorization: [reconciliation:write]

components:
  parameters:
    PageSize:
      name: pageSize
      in: query
      description: |
        The maximum number of results to return per page.
      example: 100
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 1000
    Cursor:
      name: cursor
      in: query
      description: |
        Parameter used in pagination requests. Maximum page size is set to 15.
        Set to the value of next for the next page of results.
        Set to the value of previous for the previous page of results.
        No other parameters can be set when this parameter is set.
      schema:
        type: string
        example: aHR0cHM6Ly9nLnBhZ2UvTmVrby1SYW1lbj9zaGFyZQ==
    PolicyID:
      name: policyID
      in: path
      schema:
        type: string
      description: The policy ID.
      example: XXX
      required: true
    ReconciliationID:
      name: reconciliationID
      in: path
      schema:
        type: string
      description: The reconciliation ID.
      example: XXX
      required: true
    RuleID:
      name: ruleID
      in: path
      required: true
      description: The rule ID.
      schema: { type: string, format: uuid }
    EvaluationID:
      name: evaluationID
      in: path
      required: true
      description: The evaluation ID.
      schema: { type: string, format: uuid }
    AlertID:
      name: alertID
      in: path
      required: true
      description: The alert ID.
      schema: { type: string, format: uuid }
  responses:
    NoContent:
      description: No content
    ServerInfo:
      description: Server information
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ServerInfo'
    Policies:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PoliciesCursorResponse'
    Policy:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PolicyResponse'
    Reconciliations:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReconciliationsCursorResponse'
    Reconciliation:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReconciliationResponse'
    ErrorResponse:
      description: Error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Rule:
      description: OK
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RuleResponse' }
    Rules:
      description: OK
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RulesCursorResponse' }
    Evaluation:
      description: OK
      content:
        application/json:
          schema: { $ref: '#/components/schemas/EvaluationResponse' }
    Evaluations:
      description: OK
      content:
        application/json:
          schema: { $ref: '#/components/schemas/EvaluationsCursorResponse' }
    Alert:
      description: OK
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AlertResponse' }
    Alerts:
      description: OK
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AlertsCursorResponse' }
    AlertEvents:
      description: OK
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AlertEventsResponse' }
  requestBodies:
    Policy:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PolicyRequest'
    Reconciliation:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReconciliationRequest'
    Rule:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RuleRequest' }
    RulePatch:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RulePatchRequest' }
  schemas:
    QueryBuilder:
      type: object
      additionalProperties: true
    PoliciesCursorResponse:
      type: object
      required:
        - cursor
      properties:
        cursor:
          type: object
          required:
            - pageSize
            - hasMore
            - data
          properties:
            pageSize:
              type: integer
              format: int64
              minimum: 1
              maximum: 1000
              example: 15
            hasMore:
              type: boolean
              example: false
            previous:
              type: string
              example: YXVsdCBhbmQgYSBtYXhpbXVtIG1heF9yZXN1bHRzLol=
            next:
              type: string
              example: ''
            data:
              type: array
              items:
                $ref: '#/components/schemas/Policy'
    ReconciliationsCursorResponse:
      type: object
      required:
        - cursor
      properties:
        cursor:
          type: object
          required:
            - pageSize
            - hasMore
            - data
          properties:
            pageSize:
              type: integer
              format: int64
              minimum: 1
              maximum: 1000
              example: 15
            hasMore:
              type: boolean
              example: false
            previous:
              type: string
              example: YXVsdCBhbmQgYSBtYXhpbXVtIG1heF9yZXN1bHRzLol=
            next:
              type: string
              example: ''
            data:
              type: array
              items:
                $ref: '#/components/schemas/Reconciliation'
    ServerInfo:
      type: object
      required:
        - version
      properties:
        version:
          type: string
    PolicyRequest:
      type: object
      required:
        - name
        - ledgerName
        - ledgerQuery
        - paymentsPoolID
      properties:
        name:
          type: string
          example: XXX
        ledgerName:
          type: string
          example: default
        ledgerQuery:
          type: object
          additionalProperties: true
        paymentsPoolID:
          type: string
          example: XXX
    PolicyResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/Policy'
    ReconciliationRequest:
      type: object
      required:
        - reconciledAtLedger
        - reconciledAtPayments
      properties:
        reconciledAtLedger:
          type: string
          format: date-time
          example: '2021-01-01T00:00:00.000Z'
        reconciledAtPayments:
          type: string
          format: date-time
          example: '2021-01-01T00:00:00.000Z'
    ReconciliationResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/Reconciliation'
    Policy:
      type: object
      required:
        - id
        - name
        - createdAt
        - ledgerName
        - ledgerQuery
        - paymentsPoolID
      properties:
        id:
          type: string
          example: XXX
        name:
          type: string
          example: XXX
        createdAt:
          type: string
          format: date-time
          example: '2021-01-01T00:00:00.000Z'
        ledgerName:
          type: string
          example: default
        ledgerQuery:
          type: object
          additionalProperties: true
        paymentsPoolID:
          type: string
          example: XXX
    Reconciliation:
      type: object
      required:
        - id
        - policyID
        - createdAt
        - reconciledAtLedger
        - reconciledAtPayments
        - status
        - paymentsBalances
        - ledgerBalances
        - driftBalances
      properties:
        id:
          type: string
          example: XXX
        policyID:
          type: string
          example: XXX
        createdAt:
          type: string
          format: date-time
          example: '2021-01-01T00:00:00.000Z'
        reconciledAtLedger:
          type: string
          format: date-time
          example: '2021-01-01T00:00:00.000Z'
        reconciledAtPayments:
          type: string
          format: date-time
          example: '2021-01-01T00:00:00.000Z'
        status:
          type: string
          example: COMPLETED
        paymentsBalances:
          type: object
          additionalProperties:
            type: integer
            format: bigint
        ledgerBalances:
          type: object
          additionalProperties:
            type: integer
            format: bigint
        driftBalances:
          type: object
          additionalProperties:
            type: integer
            format: bigint
        error:
          type: string
    ErrorResponse:
      type: object
      required:
        - errorCode
        - errorMessage
      properties:
        errorCode:
          type: string
          example: VALIDATION
        errorMessage:
          type: string
        details:
          type: string

    # --- V1 Ledger Clarity schemas -----------------------------------------

    Severity:
      type: string
      enum: [info, low, medium, high, critical]
    TemplateKind:
      type: string
      enum: [ledger_vs_pool_drift, ledger_invariant, account_threshold, source_parity]
    Cadence:
      type: string
      description: |
        Reconciliation rhythm. Scopes each failing fingerprint into a period so a
        March break and an April break are distinct, independently-closable cases.
        `continuous` (default) is a single unbounded period (live monitoring).
      enum: [continuous, daily, weekly, monthly]
      default: continuous
    Schedule:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [on_demand, cron] }
        expr: { type: string, example: "*/15 * * * *" }
        tz: { type: string, example: "UTC" }
        safetyMargin: { type: string, example: "30s", description: "Go duration string" }
    Ack:
      type: object
      required: [by, at]
      properties:
        by: { type: string, example: "ops@buildr.com" }
        at: { type: string, format: date-time }
        note: { type: string }
    Resolution:
      type: object
      required: [kind, by, at]
      properties:
        kind: { type: string, enum: [auto, fixed_by_booking, accepted_by_business] }
        by: { type: string }
        at: { type: string, format: date-time }
        note: { type: string }
        transactionRefs:
          type: array
          items: { type: string }
        evidenceSnapshot:
          type: object
          additionalProperties: true
        expiresAt: { type: string, format: date-time }

    Rule:
      type: object
      required: [id, name, templateKind, templateSpec, enabled, severity, cadence, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        templateKind: { $ref: '#/components/schemas/TemplateKind' }
        templateSpec:
          type: object
          additionalProperties: true
        compiledCEL: { type: string }
        enabled: { type: boolean }
        severity: { $ref: '#/components/schemas/Severity' }
        cadence: { $ref: '#/components/schemas/Cadence' }
        schedule: { $ref: '#/components/schemas/Schedule' }
        notifications:
          type: array
          items: { type: string }
        labels:
          type: object
          additionalProperties: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    RuleRequest:
      type: object
      required: [name, templateKind, templateSpec]
      properties:
        name: { type: string }
        templateKind: { $ref: '#/components/schemas/TemplateKind' }
        templateSpec:
          type: object
          additionalProperties: true
        severity: { $ref: '#/components/schemas/Severity' }
        cadence: { $ref: '#/components/schemas/Cadence' }
        schedule: { $ref: '#/components/schemas/Schedule' }
        notifications:
          type: array
          items: { type: string }
        labels:
          type: object
          additionalProperties: { type: string }
        enabled: { type: boolean }
    RulePatchRequest:
      type: object
      description: Partial update — only fields supplied are applied.
      properties:
        name: { type: string }
        templateKind: { $ref: '#/components/schemas/TemplateKind' }
        templateSpec:
          type: object
          additionalProperties: true
        enabled: { type: boolean }
        severity: { $ref: '#/components/schemas/Severity' }
        schedule: { $ref: '#/components/schemas/Schedule' }
        notifications:
          type: array
          items: { type: string }
        labels:
          type: object
          additionalProperties: { type: string }
    RuleResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Rule' }
    RulesCursorResponse:
      type: object
      required: [cursor]
      properties:
        cursor:
          type: object
          required: [pageSize, hasMore, data]
          properties:
            pageSize: { type: integer, format: int64, minimum: 1, maximum: 1000 }
            hasMore: { type: boolean }
            previous: { type: string }
            next: { type: string }
            data:
              type: array
              items: { $ref: '#/components/schemas/Rule' }

    EvaluateRuleRequest:
      type: object
      properties:
        at: { type: string, format: date-time, description: "PIT for the evaluation. Defaults to now." }
        safetyMargin: { type: string, example: "30s", description: "Go duration string subtracted from `at`. Defaults to 30s." }
    Evaluation:
      type: object
      required: [id, ruleID, startedAt, endedAt, result, createdAt]
      properties:
        id: { type: string, format: uuid }
        ruleID: { type: string, format: uuid }
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time }
        pitPerSource:
          type: object
          additionalProperties: { type: string, format: date-time }
        result: { type: string, enum: [PASS, FAIL, ERROR] }
        evidence:
          oneOf:
            - type: array
              items:
                type: object
                additionalProperties: true
            - type: object
              additionalProperties: true
        error: { type: string }
        costUnits: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
    EvaluationResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Evaluation' }
    EvaluationsCursorResponse:
      type: object
      required: [cursor]
      properties:
        cursor:
          type: object
          required: [pageSize, hasMore, data]
          properties:
            pageSize: { type: integer, format: int64 }
            hasMore: { type: boolean }
            previous: { type: string }
            next: { type: string }
            data:
              type: array
              items: { $ref: '#/components/schemas/Evaluation' }

    Alert:
      type: object
      description: |
        An Alert is the stable, dedup'd record of a failing fingerprint within a
        reconciliation period. There is exactly one Alert per
        (ruleID, fingerprint, periodID) — within a period, re-opens after resolve
        flip the status back to OPEN in place; the same fingerprint failing in a
        new period is a separate Alert. For a `continuous`-cadence rule there is
        one unbounded period, so it behaves as one Alert per (ruleID, fingerprint).
        The full history of transitions lives in alert_event
        (see /alerts/{alertID}/events).
      required: [id, ruleID, fingerprint, periodID, status, severity, firstSeenAt, lastSeenAt, occurrenceCount, lastEvaluationID, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        ruleID: { type: string, format: uuid }
        fingerprint: { type: string, example: "asset:USD/2" }
        periodID: { type: string, example: "2026-03", description: "Reconciliation period this alert is scoped to ('continuous' for live-monitoring rules)." }
        status: { type: string, enum: [OPEN, ACKNOWLEDGED, RESOLVED] }
        severity: { $ref: '#/components/schemas/Severity' }
        firstSeenAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        occurrenceCount: { type: integer, format: int64, description: "Count of FAIL events on this alert across reopen cycles within its period (lifetime, for a continuous-cadence rule)." }
        lastEvaluationID: { type: string, format: uuid }
        evidence:
          type: object
          additionalProperties: true
        ack: { $ref: '#/components/schemas/Ack' }
        resolution: { $ref: '#/components/schemas/Resolution' }
        labels:
          type: object
          additionalProperties: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AlertResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Alert' }
    AlertsCursorResponse:
      type: object
      required: [cursor]
      properties:
        cursor:
          type: object
          required: [pageSize, hasMore, data]
          properties:
            pageSize: { type: integer, format: int64 }
            hasMore: { type: boolean }
            previous: { type: string }
            next: { type: string }
            data:
              type: array
              items: { $ref: '#/components/schemas/Alert' }

    AlertEvent:
      type: object
      description: |
        One row of the alert's append-only event log. Captures every
        evaluation that touched the alert plus every manual transition
        (ack / resolve / accept). `prevStatus` is null only for the
        inaugural event of an alert. `isReopen` is a derived predicate —
        true when a FAIL event lands on a previously-RESOLVED alert.
        `notify` is the notification decision recorded for the row: false marks
        a transition kept for audit but deliberately not published (a repeated
        identical fail).
      required: [id, alertID, type, newStatus, at, isReopen, notify]
      properties:
        id: { type: string, format: uuid }
        alertID: { type: string, format: uuid }
        evaluationID: { type: string, format: uuid, nullable: true }
        type: { type: string, enum: [fail, pass, ack, resolve, accept] }
        prevStatus: { type: string, enum: [OPEN, ACKNOWLEDGED, RESOLVED], nullable: true }
        newStatus: { type: string, enum: [OPEN, ACKNOWLEDGED, RESOLVED] }
        payload:
          description: Event-type-specific payload (evidence for fail, resolution for resolve/accept, ack object for ack).
          type: object
          additionalProperties: true
        at: { type: string, format: date-time }
        isReopen: { type: boolean }
        notify: { type: boolean, description: "Whether this transition was published to the message bus. false = recorded for audit but suppressed." }
    AlertEventsResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/AlertEvent' }

    AckAlertRequest:
      type: object
      required: [by]
      properties:
        by: { type: string, example: "ops@buildr.com" }
        note: { type: string }
    ResolveAlertRequest:
      type: object
      required: [by]
      description: |
        Mark an alert resolved. When `transactionRefs` is non-empty the
        resolution kind is recorded as `fixed_by_booking`.
      properties:
        by: { type: string }
        note: { type: string }
        transactionRefs:
          type: array
          items: { type: string }
    AcceptAlertRequest:
      type: object
      required: [by, note]
      description: Business acceptance. `note` is required and the evidence is snapshotted onto the resolution.
      properties:
        by: { type: string }
        note: { type: string, minLength: 1 }
        expiresAt: { type: string, format: date-time }
