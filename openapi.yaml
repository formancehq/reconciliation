openapi: 3.0.3
info:
  title: Reconciliation API
  version: RECONCILIATION_VERSION
paths:
  /_info:
    get:
      summary: Get server info
      operationId: getServerInfo
      tags:
        - reconciliation.v1
      responses:
        '200':
          $ref: '#/components/responses/ServerInfo'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
        - Authorization:
            - reconciliation:read
  /policies:
    post:
      summary: Create a policy
      tags:
        - reconciliation.v1
      operationId: createPolicy
      description: Create a policy
      requestBody:
        $ref: '#/components/requestBodies/Policy'
      responses:
        '201':
          $ref: '#/components/responses/Policy'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
        - Authorization:
            - reconciliation:write
    get:
      summary: List policies
      operationId: listPolicies
      tags:
        - reconciliation.v1
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryBuilder'
      responses:
        '200':
          $ref: '#/components/responses/Policies'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
        - Authorization:
            - reconciliation:read
  /policies/{policyID}:
    delete:
      summary: Delete a policy
      operationId: deletePolicy
      tags:
        - reconciliation.v1
      description: Delete a policy by its id.
      parameters:
        - $ref: '#/components/parameters/PolicyID'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
        - Authorization:
            - reconciliation:write
    get:
      summary: Get a policy
      tags:
        - reconciliation.v1
      operationId: getPolicy
      parameters:
        - $ref: '#/components/parameters/PolicyID'
      responses:
        '200':
          $ref: '#/components/responses/Policy'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
        - Authorization:
            - reconciliation:read
  /policies/{policyID}/reconciliation:
    post:
      summary: Reconcile using a policy
      tags:
        - reconciliation.v1
      operationId: reconcile
      description: Reconcile using a policy
      parameters:
        - $ref: '#/components/parameters/PolicyID'
      requestBody:
        $ref: '#/components/requestBodies/Reconciliation'
      responses:
        '200':
          $ref: '#/components/responses/Reconciliation'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
        - Authorization:
            - reconciliation:write
  /reconciliations:
    get:
      summary: List reconciliations
      operationId: listReconciliations
      tags:
        - reconciliation.v1
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryBuilder'
      responses:
        '200':
          $ref: '#/components/responses/Reconciliations'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
        - Authorization:
            - reconciliation:read
  /reconciliations/{reconciliationID}:
    get:
      summary: Get a reconciliation
      tags:
        - reconciliation.v1
      operationId: getReconciliation
      parameters:
        - $ref: '#/components/parameters/ReconciliationID'
      responses:
        '200':
          $ref: '#/components/responses/Reconciliation'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
        - Authorization:
            - reconciliation:read

  # --- V1 Ledger Clarity surface ---------------------------------------------

  /rules:
    post:
      summary: Create a rule
      operationId: createRule
      tags: [reconciliation.v1]
      requestBody: { $ref: '#/components/requestBodies/Rule' }
      responses:
        '201': { $ref: '#/components/responses/Rule' }
        default: { $ref: '#/components/responses/ErrorResponse' }
      security:
        - Authorization: [reconciliation:write]
    get:
      summary: List rules
      operationId: listRules
      tags: [reconciliation.v1]
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QueryBuilder' }
      responses:
        '200': { $ref: '#/components/responses/Rules' }
        default: { $ref: '#/components/responses/ErrorResponse' }
      security:
        - Authorization: [reconciliation:read]

  /rules/{ruleID}:
    parameters: [{ $ref: '#/components/parameters/RuleID' }]
    get:
      summary: Get a rule
      operationId: getRule
      tags: [reconciliation.v1]
      responses:
        '200': { $ref: '#/components/responses/Rule' }
        default: { $ref: '#/components/responses/ErrorResponse' }
      security:
        - Authorization: [reconciliation:read]
    patch:
      summary: Patch a rule (partial update)
      operationId: patchRule
      tags: [reconciliation.v1]
      requestBody: { $ref: '#/components/requestBodies/RulePatch' }
      responses:
        '200': { $ref: '#/components/responses/Rule' }
        default: { $ref: '#/components/responses/ErrorResponse' }
      security:
        - Authorization: [reconciliation:write]
    delete:
      summary: Delete a rule (cascades to evaluations + alerts + alert events)
      operationId: deleteRule
      tags: [reconciliation.v1]
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        default: { $ref: '#/components/responses/ErrorResponse' }
      security:
        - Authorization: [reconciliation:write]

  /rules/{ruleID}/evaluate:
    post:
      summary: Evaluate a rule now
      operationId: evaluateRule
      tags: [reconciliation.v1]
      parameters: [{ $ref: '#/components/parameters/RuleID' }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EvaluateRuleRequest' }
      responses:
        '200': { $ref: '#/components/responses/Evaluation' }
        '409': { $ref: '#/components/responses/ErrorResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
      security:
        - Authorization: [reconciliation:write]

  /evaluations:
    get:
      summary: List evaluations
      operationId: listEvaluations
      tags: [reconciliation.v1]
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QueryBuilder' }
      responses:
        '200': { $ref: '#/components/responses/Evaluations' }
        default: { $ref: '#/components/responses/ErrorResponse' }
      security:
        - Authorization: [reconciliation:read]

  /evaluations/{evaluationID}:
    get:
      summary: Get an evaluation
      operationId: getEvaluation
      tags: [reconciliation.v1]
      parameters: [{ $ref: '#/components/parameters/EvaluationID' }]
      responses:
        '200': { $ref: '#/components/responses/Evaluation' }
        default: { $ref: '#/components/responses/ErrorResponse' }
      security:
        - Authorization: [reconciliation:read]

  /alerts:
    get:
      summary: List alerts
      operationId: listAlerts
      tags: [reconciliation.v1]
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QueryBuilder' }
      responses:
        '200': { $ref: '#/components/responses/Alerts' }
        default: { $ref: '#/components/responses/ErrorResponse' }
      security:
        - Authorization: [reconciliation:read]

  /alerts/{alertID}:
    parameters: [{ $ref: '#/components/parameters/AlertID' }]
    get:
      summary: Get an alert
      operationId: getAlert
      tags: [reconciliation.v1]
      responses:
        '200': { $ref: '#/components/responses/Alert' }
        default: { $ref: '#/components/responses/ErrorResponse' }
      security:
        - Authorization: [reconciliation:read]

  /alerts/{alertID}/events:
    parameters: [{ $ref: '#/components/parameters/AlertID' }]
    get:
      summary: List alert events (append-only timeline)
      operationId: listAlertEvents
      description: |
        Returns a page of the events recorded for this alert — every evaluation
        that touched it plus every manual transition. The list is append-only;
        events are never modified or deleted. Ordered most-recent-first and
        cursor-paginated: a long-lived alert's timeline is unbounded (one row per
        failing evaluation), so callers must page through it.
      tags: [reconciliation.v1]
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200': { $ref: '#/components/responses/AlertEvents' }
        default: { $ref: '#/components/responses/ErrorResponse' }
      security:
        - Authorization: [reconciliation:read]

  /alerts/{alertID}/ack:
    post:
      summary: Acknowledge an alert
      operationId: ackAlert
      tags: [reconciliation.v1]
      parameters: [{ $ref: '#/components/parameters/AlertID' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AckAlertRequest' }
      responses:
        '200': { $ref: '#/components/responses/Alert' }
        default: { $ref: '#/components/responses/ErrorResponse' }
      security:
        - Authorization: [reconciliation:write]

  /alerts/{alertID}/resolve:
    post:
      summary: Resolve an alert (fixed_by_booking)
      operationId: resolveAlert
      tags: [reconciliation.v1]
      parameters: [{ $ref: '#/components/parameters/AlertID' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResolveAlertRequest' }
      responses:
        '200': { $ref: '#/components/responses/Alert' }
        default: { $ref: '#/components/responses/ErrorResponse' }
      security:
        - Authorization: [reconciliation:write]

  /alerts/{alertID}/accept:
    post:
      summary: Accept an alert (accepted_by_business)
      operationId: acceptAlert
      tags: [reconciliation.v1]
      parameters: [{ $ref: '#/components/parameters/AlertID' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcceptAlertRequest' }
      responses:
        '200': { $ref: '#/components/responses/Alert' }
        default: { $ref: '#/components/responses/ErrorResponse' }
      security:
        - Authorization: [reconciliation:write]

  /alerts/{alertID}/snooze:
    post:
      summary: Snooze an alert's notifications until a future instant
      description: |
        Mutes the alert's webhook notifications until `until`. The alert keeps
        failing, keeps its status, and keeps counting against period-green —
        only its notifications are suppressed, even if the discrepancy changes.
        The first failing evaluation at or after `until` clears the snooze and
        notifies once. Re-snoozing overwrites the window. Rejects RESOLVED
        alerts and a non-future `until`.
      operationId: snoozeAlert
      tags: [reconciliation.v1]
      parameters: [{ $ref: '#/components/parameters/AlertID' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SnoozeAlertRequest' }
      responses:
        '200': { $ref: '#/components/responses/Alert' }
        default: { $ref: '#/components/responses/ErrorResponse' }
      security:
        - Authorization: [reconciliation:write]

  /alerts/{alertID}/unsnooze:
    post:
      summary: Lift a snooze early
      description: |
        Clears an active snooze before its window elapses. Idempotent —
        unsnoozing an alert that is not snoozed returns it unchanged.
      operationId: unsnoozeAlert
      tags: [reconciliation.v1]
      parameters: [{ $ref: '#/components/parameters/AlertID' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UnsnoozeAlertRequest' }
      responses:
        '200': { $ref: '#/components/responses/Alert' }
        default: { $ref: '#/components/responses/ErrorResponse' }
      security:
        - Authorization: [reconciliation:write]

  /audit-entries:
    get:
      summary: Walk the audit journal
      operationId: listAuditEntries
      description: |
        Returns a page of the module's append-only, hash-chained journal in chain
        order. Every state-bearing operation is here: controls created, revised
        and deleted, every evaluation (passing ones included — those are what
        prove a control ran on the days nothing was wrong), every alert
        transition including the ones whose notification was suppressed, and
        every period seal.

        The `sequence` is dense: consecutive entries have consecutive numbers, so
        a removed entry leaves a hole that `POST /audit-entries/verify` reports.
        Page with `after=<sequence>`; `head` tells you where the journal
        currently ends, so you know how much is left without a second call.

        `actor=system` and `actor=human` split machine-run controls from human
        intervention. That distinction is bound into each entry's hash rather
        than declared in a field, so it is worth relying on.

        Payloads are omitted here — read a single entry to get its memento.
      tags: [reconciliation.v1]
      parameters:
        - name: kind
          in: query
          description: Comma-separated operation kinds to include.
          schema:
            type: string
            example: evaluation.committed,alert.transition
        - { name: ruleID, in: query, schema: { type: string, format: uuid } }
        - { name: alertID, in: query, schema: { type: string, format: uuid } }
        - { name: evaluationID, in: query, schema: { type: string, format: uuid } }
        - name: periodID
          in: query
          description: Reconciliation period, e.g. `2026-05`.
          schema: { type: string }
        - name: subject
          in: query
          description: Exact match on the acting principal's token subject.
          schema: { type: string }
        - name: actor
          in: query
          description: Restrict to machine-run or human-initiated entries.
          schema: { type: string, enum: [system, human] }
        - { name: fromSequence, in: query, schema: { type: integer, format: int64 } }
        - { name: toSequence, in: query, schema: { type: integer, format: int64 } }
        - name: from
          in: query
          description: RFC3339 lower bound on the entry timestamp.
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: RFC3339 upper bound on the entry timestamp.
          schema: { type: string, format: date-time }
        - name: after
          in: query
          description: Resume after this sequence.
          schema: { type: integer, format: int64 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
      responses:
        '200':
          description: A page of the journal.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditEntriesResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
      security:
        - Authorization: [reconciliation:read]

  /audit-entries/{sequence}:
    parameters:
      - name: sequence
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      summary: Read one journal entry
      operationId: getAuditEntry
      description: |
        Returns one entry including its memento — the exact canonical bytes that
        were hashed. `memento` is base64 and is the authoritative form for
        recomputing `mementoDigest` yourself; `mementoJSON` is the same bytes
        parsed, for reading.

        The canonical form is JCS-inspired and has four rules, so a client in any
        language can reproduce it: object keys sorted by UTF-8 byte sequence, no
        insignificant whitespace, number literals preserved exactly as written
        (never re-parsed through a float), and standard JSON string escaping with
        HTML escaping disabled.
      tags: [reconciliation.v1]
      responses:
        '200':
          description: The entry, with its payload.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditEntry' }
        default: { $ref: '#/components/responses/ErrorResponse' }
      security:
        - Authorization: [reconciliation:read]

  /audit-entries/verify:
    post:
      summary: Verify the journal's integrity
      operationId: verifyAuditChain
      description: |
        Recomputes a range of the chain and reports whether it is intact. An
        empty body verifies everything, which is usually the request you want.
        Pass `periodID` to verify exactly the range a period seal covers — the
        short path to "prove May was not touched after we closed it".

        The walk stops at the first violation: past a break, every downstream
        comparison is meaningless. Violations are `HASH_MISMATCH` (a hashed field
        was altered), `SEQUENCE_GAP` (an entry was removed), `BROKEN_LINK`
        (entries were reordered or spliced) and `MEMENTO_DIGEST_MISMATCH` (a
        payload was edited).

        One limitation worth knowing: past the most recent seal, deletion of the
        journal's tail is not detectable from the journal alone, because the head
        is derived from the same table. Sealing periods is what closes that
        window — a seal commits to a boundary, so anything removed below it is
        caught.
      tags: [reconciliation.v1]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyChainRequest' }
      responses:
        '200':
          description: |
            The verification result. Note that a detected violation is still a
            200 — the request succeeded, and the answer is that the journal is
            broken.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChainVerification' }
        default: { $ref: '#/components/responses/ErrorResponse' }
      security:
        - Authorization: [reconciliation:read]

  /audit-signing-keys:
    get:
      summary: Public keys that verify period seals
      operationId: listAuditSigningKeys
      description: |
        Returns the Ed25519 public keys this installation signs period seals
        with. This is the only value an auditor needs from us in order to check a
        seal independently: recompute the sealing hash from the seal's own
        published fields, then verify the signature against the key whose id the
        seal names.

        Retired keys stay listed. A seal signed two years ago has to remain
        checkable after a rotation.
      tags: [reconciliation.v1]
      responses:
        '200':
          description: The published verification keys, active first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/VerificationKey' }
        default: { $ref: '#/components/responses/ErrorResponse' }
      security:
        - Authorization: [reconciliation:read]

  /periods:
    get:
      summary: List sealed periods
      operationId: listPeriods
      description: |
        Returns every period that has been closed, most recent first. Open
        periods have no row — absence is the open state.
      tags: [reconciliation.v1]
      responses:
        '200':
          description: The sealed periods.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PeriodSeal' }
        default: { $ref: '#/components/responses/ErrorResponse' }
      security:
        - Authorization: [reconciliation:read]

  /periods/{periodID}:
    parameters:
      - { name: periodID, in: path, required: true, schema: { type: string } }
    get:
      summary: Get a period's seal
      operationId: getPeriod
      description: |
        Returns the period's seal, or `status: OPEN` when it has not been closed.
        An unsealed period is a legitimate answer rather than a missing
        resource, so this does not 404 — you would otherwise have to guess
        whether the period is open or the id was wrong.
      tags: [reconciliation.v1]
      responses:
        '200':
          description: The seal, or an open period.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PeriodSeal' }
        default: { $ref: '#/components/responses/ErrorResponse' }
      security:
        - Authorization: [reconciliation:read]

  /periods/{periodID}/seal:
    parameters:
      - { name: periodID, in: path, required: true, schema: { type: string } }
    post:
      summary: Close a reconciliation period
      operationId: sealPeriod
      description: |
        Closes the period: freezes the journal range that has accumulated since
        the previous seal, hashes the period's resulting alert state, and signs
        the result. What comes back is one value — the sealing hash — standing
        for a whole period of controls.

        Sealing also raises a write barrier. Alerts scoped to a sealed period
        stop accepting transitions, so acknowledging or resolving one afterwards
        fails with 409. Under a periodic cadence the next period opens a fresh
        case for the same fingerprint, so ordinary monitoring is unaffected;
        what is refused is editing closed books.

        The operator is taken from the request's token, not from a payload field.
        Not idempotent: a second seal on the same period is a 409, because
        sealing twice would either contradict the first seal or silently do
        nothing.

        The `continuous` pseudo-period of a live-monitoring rule cannot be
        sealed — it has no end, and its alerts would be frozen with no successor
        period to move to.
      tags: [reconciliation.v1]
      responses:
        '201':
          description: The period is closed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PeriodSeal' }
        default: { $ref: '#/components/responses/ErrorResponse' }
      security:
        - Authorization: [reconciliation:write]

  /periods/{periodID}/verify:
    parameters:
      - { name: periodID, in: path, required: true, schema: { type: string } }
    post:
      summary: Verify a period seal's signature
      operationId: verifyPeriodSeal
      description: |
        Re-derives the seal's sealing hash from its stored fields and checks the
        signature against the key that signed it, including a retired one.

        An auditor can and should do this themselves — everything needed is
        published. The endpoint exists so they can confirm their own tooling
        agrees with ours before relying on it.
      tags: [reconciliation.v1]
      responses:
        '200':
          description: The verification result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SealVerification' }
        default: { $ref: '#/components/responses/ErrorResponse' }
      security:
        - Authorization: [reconciliation:read]

  /rules/{ruleID}/revisions:
    parameters: [{ $ref: '#/components/parameters/RuleID' }]
    get:
      summary: List a control's frozen definitions
      operationId: listRuleRevisions
      description: |
        Returns every revision of the control, newest first. The rule itself only
        ever holds its latest definition, so without these an evaluation
        referencing revision 3 of a control now at revision 7 could not be
        explained — you would have the verdict but not what was checked.
      tags: [reconciliation.v1]
      responses:
        '200':
          description: The control's revisions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/RuleRevision' }
        default: { $ref: '#/components/responses/ErrorResponse' }
      security:
        - Authorization: [reconciliation:read]

  /rules/{ruleID}/revisions/{revision}:
    parameters:
      - { $ref: '#/components/parameters/RuleID' }
      - { name: revision, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      summary: Get one frozen control definition
      operationId: getRuleRevision
      description: |
        Returns the control exactly as it stood at that revision — what an
        evaluation recording this revision actually evaluated.
      tags: [reconciliation.v1]
      responses:
        '200':
          description: The frozen definition.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuleRevision' }
        default: { $ref: '#/components/responses/ErrorResponse' }
      security:
        - Authorization: [reconciliation:read]

components:
  parameters:
    PageSize:
      name: pageSize
      in: query
      description: |
        The maximum number of results to return per page.
      example: 100
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 100
    Cursor:
      name: cursor
      in: query
      description: |
        Parameter used in pagination requests. Maximum page size is set to 15.
        Set to the value of next for the next page of results.
        Set to the value of previous for the previous page of results.
        No other parameters can be set when this parameter is set.
      schema:
        type: string
        example: aHR0cHM6Ly9nLnBhZ2UvTmVrby1SYW1lbj9zaGFyZQ==
    PolicyID:
      name: policyID
      in: path
      schema:
        type: string
      description: The policy ID.
      example: XXX
      required: true
    ReconciliationID:
      name: reconciliationID
      in: path
      schema:
        type: string
      description: The reconciliation ID.
      example: XXX
      required: true
    RuleID:
      name: ruleID
      in: path
      required: true
      description: The rule ID.
      schema: { type: string, format: uuid }
    EvaluationID:
      name: evaluationID
      in: path
      required: true
      description: The evaluation ID.
      schema: { type: string, format: uuid }
    AlertID:
      name: alertID
      in: path
      required: true
      description: The alert ID.
      schema: { type: string, format: uuid }
  responses:
    NoContent:
      description: No content
    ServerInfo:
      description: Server information
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ServerInfo'
    Policies:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PoliciesCursorResponse'
    Policy:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PolicyResponse'
    Reconciliations:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReconciliationsCursorResponse'
    Reconciliation:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReconciliationResponse'
    ErrorResponse:
      description: Error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Rule:
      description: OK
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RuleResponse' }
    Rules:
      description: OK
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RulesCursorResponse' }
    Evaluation:
      description: OK
      content:
        application/json:
          schema: { $ref: '#/components/schemas/EvaluationResponse' }
    Evaluations:
      description: OK
      content:
        application/json:
          schema: { $ref: '#/components/schemas/EvaluationsCursorResponse' }
    Alert:
      description: OK
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AlertResponse' }
    Alerts:
      description: OK
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AlertsCursorResponse' }
    AlertEvents:
      description: OK
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AlertEventsCursorResponse' }
  requestBodies:
    Policy:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PolicyRequest'
    Reconciliation:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReconciliationRequest'
    Rule:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RuleRequest' }
    RulePatch:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RulePatchRequest' }
  schemas:

    AuditSubject:
      type: object
      description: |
        Who performed the operation, derived from the verified bearer token — not
        from a client-supplied field. `source` names which identifier
        `sourceValue` holds, and it enters the hash as a distinct tag, so a
        machine-run control and a caller-less request are cryptographically
        distinguishable rather than distinguishable by convention.
      properties:
        actor: { type: string, description: 'Human-readable form, e.g. `system:scheduler` or the token subject.' }
        subject: { type: string, description: 'OIDC `sub`, or the client id for a machine-to-machine token. Empty for a system component.' }
        source: { type: string, enum: [issuer, client_id, system_component] }
        sourceValue: { type: string, description: 'The issuer URL, the client id, or the component name.' }
        scopes: { type: array, items: { type: string }, description: 'Token scopes, stored sorted so the hash does not depend on emission order.' }
        system: { type: boolean, description: 'True when the module itself acted rather than an authenticated caller.' }

    AuditEntry:
      type: object
      description: One link of the hash chain.
      properties:
        sequence: { type: integer, format: int64, description: 'Dense logical position. Consecutive by construction, so a gap means an entry was removed.' }
        at: { type: string, format: date-time }
        kind:
          type: string
          enum: [rule.created, rule.revised, rule.deleted, evaluation.committed, alert.transition, period.sealed]
        ruleID: { type: string, format: uuid }
        ruleRevision: { type: integer, format: int64 }
        alertID: { type: string, format: uuid }
        evaluationID: { type: string, format: uuid }
        periodID: { type: string }
        subject: { $ref: '#/components/schemas/AuditSubject' }
        mementoDigest: { type: string, description: 'Hex BLAKE3 digest of the canonical payload. Unkeyed, so you can check it yourself.' }
        prevHash: { type: string, description: 'Hex hash of the preceding entry. Absent on the first entry.' }
        hash: { type: string, description: 'Hex keyed BLAKE3 over the previous hash and every field above. Keyed with an installation secret, so it cannot be recomputed from a database dump alone.' }
        hashVersion: { type: integer }
        memento: { type: string, description: 'Base64 of the exact canonical bytes that were hashed. Single-entry reads only.' }
        mementoJSON: { type: object, description: 'The same bytes parsed, for reading. Single-entry reads only.' }
        createdAt: { type: string, format: date-time }

    AuditEntriesResponse:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/AuditEntry' } }
        next: { type: integer, format: int64, description: 'Pass as `after` to continue. Absent on the last page.' }
        head: { type: integer, format: int64, description: 'Where the journal ends right now.' }
        headHash: { type: string, description: 'Hex hash at the head.' }

    VerifyChainRequest:
      type: object
      description: |
        An empty body verifies the whole journal. Give either a sequence range or
        a `periodID`, not both.
      properties:
        fromSequence: { type: integer, format: int64 }
        toSequence: { type: integer, format: int64 }
        periodID: { type: string, description: 'Verify exactly the range this period''s seal covers.' }

    ChainVerification:
      type: object
      properties:
        ok: { type: boolean }
        firstSequence: { type: integer, format: int64 }
        lastSequence: { type: integer, format: int64 }
        entriesWalked: { type: integer, format: int64 }
        violation:
          type: string
          enum: [HASH_MISMATCH, SEQUENCE_GAP, BROKEN_LINK, MEMENTO_DIGEST_MISMATCH]
        atSequence: { type: integer, format: int64, description: 'Where the walk stopped.' }
        detail: { type: string, description: 'What went wrong, in terms an auditor can quote.' }
        sealsCrossed: { type: array, items: { type: string }, description: 'Period seals traversed and re-derived during the walk.' }

    PeriodSeal:
      type: object
      description: |
        A closed reconciliation period. Seals partition the journal at sequence
        boundaries: `firstSequence` continues from the previous seal, with no gap
        and no overlap.
      properties:
        periodID: { type: string }
        status: { type: string, enum: [OPEN, SEALED] }
        firstSequence: { type: integer, format: int64 }
        lastSequence: { type: integer, format: int64 }
        entryCount: { type: integer, format: int64 }
        lastAuditHash: { type: string, description: 'Hex chain head at seal time. Verification resumes across the boundary from here.' }
        stateHash: { type: string, description: 'Hex digest of the period''s resulting alert state, so the seal commits to the outcome as well as the journal.' }
        sealingHash: { type: string, description: 'Hex. The single value standing for the whole period. Unkeyed, so it is reproducible from the fields above by anyone.' }
        signature: { type: string, description: 'Base64 Ed25519 signature over `sealingHash`. This is what makes the seal verifiable without trusting this service.' }
        signingKeyID: { type: string, description: 'Which published key verifies the signature.' }
        sealedBy: { $ref: '#/components/schemas/AuditSubject' }
        alertCount: { type: integer, format: int64 }
        unresolvedCount: { type: integer, format: int64, description: 'How many discrepancies were still open when the period closed — usually the first figure an auditor asks for.' }
        sealedAt: { type: string, format: date-time }
        auditSequence: { type: integer, format: int64, description: 'The journal entry recording this seal. It lands after the boundary it describes, so it belongs to the following period.' }

    SealVerification:
      type: object
      properties:
        periodID: { type: string }
        ok: { type: boolean }
        reason: { type: string, description: 'Why verification failed, when it did.' }
        seal: { $ref: '#/components/schemas/PeriodSeal' }

    VerificationKey:
      type: object
      properties:
        keyID: { type: string }
        publicKey: { type: string, description: 'Base64 Ed25519 public key.' }
        algorithm: { type: string, example: Ed25519 }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
        retiredAt: { type: string, format: date-time }
        thumbprint: { type: string }

    RuleRevision:
      type: object
      description: An immutable snapshot of a control definition at one revision.
      properties:
        ruleID: { type: string, format: uuid }
        revision: { type: integer, format: int64 }
        name: { type: string }
        templateKind: { type: string }
        templateSpec: { type: object }
        explanationCEL: { type: string }
        severity: { type: string }
        cadence: { type: string }
        enabled: { type: boolean }
        schedule: { type: object }
        notifications: { type: array, items: { type: string } }
        labels: { type: object, additionalProperties: { type: string } }
        auditSequence: { type: integer, format: int64, description: 'The journal entry that witnessed this revision. Zero for definitions recovered when the journal was introduced — recovered, not witnessed, and the distinction is left visible.' }
        createdAt: { type: string, format: date-time }
    QueryBuilder:
      type: object
      additionalProperties: true
    PoliciesCursorResponse:
      type: object
      required:
        - cursor
      properties:
        cursor:
          type: object
          required:
            - pageSize
            - hasMore
            - data
          properties:
            pageSize:
              type: integer
              format: int64
              minimum: 1
              maximum: 100
              example: 15
            hasMore:
              type: boolean
              example: false
            previous:
              type: string
              example: YXVsdCBhbmQgYSBtYXhpbXVtIG1heF9yZXN1bHRzLol=
            next:
              type: string
              example: ''
            data:
              type: array
              items:
                $ref: '#/components/schemas/Policy'
    ReconciliationsCursorResponse:
      type: object
      required:
        - cursor
      properties:
        cursor:
          type: object
          required:
            - pageSize
            - hasMore
            - data
          properties:
            pageSize:
              type: integer
              format: int64
              minimum: 1
              maximum: 100
              example: 15
            hasMore:
              type: boolean
              example: false
            previous:
              type: string
              example: YXVsdCBhbmQgYSBtYXhpbXVtIG1heF9yZXN1bHRzLol=
            next:
              type: string
              example: ''
            data:
              type: array
              items:
                $ref: '#/components/schemas/Reconciliation'
    ServerInfo:
      type: object
      required:
        - version
      properties:
        version:
          type: string
    PolicyRequest:
      type: object
      required:
        - name
        - ledgerName
        - ledgerQuery
        - paymentsPoolID
      properties:
        name:
          type: string
          example: XXX
        ledgerName:
          type: string
          example: default
        ledgerQuery:
          type: object
          additionalProperties: true
        paymentsPoolID:
          type: string
          example: XXX
    PolicyResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/Policy'
    ReconciliationRequest:
      type: object
      required:
        - reconciledAtLedger
        - reconciledAtPayments
      properties:
        reconciledAtLedger:
          type: string
          format: date-time
          example: '2021-01-01T00:00:00.000Z'
        reconciledAtPayments:
          type: string
          format: date-time
          example: '2021-01-01T00:00:00.000Z'
    ReconciliationResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/Reconciliation'
    Policy:
      type: object
      required:
        - id
        - name
        - createdAt
        - ledgerName
        - ledgerQuery
        - paymentsPoolID
      properties:
        id:
          type: string
          example: XXX
        name:
          type: string
          example: XXX
        createdAt:
          type: string
          format: date-time
          example: '2021-01-01T00:00:00.000Z'
        ledgerName:
          type: string
          example: default
        ledgerQuery:
          type: object
          additionalProperties: true
        paymentsPoolID:
          type: string
          example: XXX
    Reconciliation:
      type: object
      required:
        - id
        - policyID
        - createdAt
        - reconciledAtLedger
        - reconciledAtPayments
        - status
        - paymentsBalances
        - ledgerBalances
        - driftBalances
      properties:
        id:
          type: string
          example: XXX
        policyID:
          type: string
          example: XXX
        createdAt:
          type: string
          format: date-time
          example: '2021-01-01T00:00:00.000Z'
        reconciledAtLedger:
          type: string
          format: date-time
          example: '2021-01-01T00:00:00.000Z'
        reconciledAtPayments:
          type: string
          format: date-time
          example: '2021-01-01T00:00:00.000Z'
        status:
          type: string
          example: COMPLETED
        paymentsBalances:
          type: object
          additionalProperties:
            type: integer
            format: bigint
        ledgerBalances:
          type: object
          additionalProperties:
            type: integer
            format: bigint
        driftBalances:
          type: object
          additionalProperties:
            type: integer
            format: bigint
        error:
          type: string
    ErrorResponse:
      type: object
      required:
        - errorCode
        - errorMessage
      properties:
        errorCode:
          type: string
          example: VALIDATION
        errorMessage:
          type: string
        details:
          type: string

    # --- V1 Ledger Clarity schemas -----------------------------------------

    Severity:
      type: string
      enum: [info, low, medium, high, critical]
    TemplateKind:
      type: string
      enum: [ledger_vs_pool_drift, ledger_invariant, account_threshold, source_parity]
    Cadence:
      type: string
      description: |
        Reconciliation rhythm. Scopes each failing fingerprint into a period so a
        March break and an April break are distinct, independently-closable cases.
        `continuous` (default) is a single unbounded period (live monitoring).
      enum: [continuous, daily, weekly, monthly]
      default: continuous
    Schedule:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [on_demand, cron] }
        expr: { type: string, example: "*/15 * * * *" }
        tz: { type: string, example: "UTC" }
        safetyMargin: { type: string, example: "30s", description: "Go duration string" }
    Ack:
      type: object
      required: [by, at]
      properties:
        by: { type: string, example: "ops@buildr.com" }
        at: { type: string, format: date-time }
        note: { type: string }
    Resolution:
      type: object
      required: [kind, by, at]
      properties:
        kind: { type: string, enum: [auto, fixed_by_booking, accepted_by_business] }
        by: { type: string }
        at: { type: string, format: date-time }
        note: { type: string }
        transactionRefs:
          type: array
          items: { type: string }
        evidenceSnapshot:
          type: object
          additionalProperties: true
    Snooze:
      type: object
      description: |
        A time-boxed, operator-initiated mute of an alert's notifications. While
        `until` is in the future the alert keeps failing and keeps counting
        against period-green — only its notifications are suppressed.
      required: [until, by, at]
      properties:
        until: { type: string, format: date-time }
        by: { type: string, example: "ops@buildr.com" }
        at: { type: string, format: date-time }
        note: { type: string }

    Rule:
      type: object
      required: [id, name, templateKind, templateSpec, enabled, severity, cadence, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        templateKind: { $ref: '#/components/schemas/TemplateKind' }
        templateSpec:
          type: object
          additionalProperties: true
        explanationCEL:
          type: string
          description: Representative CEL for human explanation; not the runtime program.
        enabled: { type: boolean }
        severity: { $ref: '#/components/schemas/Severity' }
        cadence: { $ref: '#/components/schemas/Cadence' }
        schedule: { $ref: '#/components/schemas/Schedule' }
        notifications:
          type: array
          items: { type: string }
        labels:
          type: object
          additionalProperties: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    RuleRequest:
      type: object
      required: [name, templateKind, templateSpec]
      properties:
        name: { type: string }
        templateKind: { $ref: '#/components/schemas/TemplateKind' }
        templateSpec:
          type: object
          additionalProperties: true
        severity: { $ref: '#/components/schemas/Severity' }
        cadence: { $ref: '#/components/schemas/Cadence' }
        schedule: { $ref: '#/components/schemas/Schedule' }
        notifications:
          type: array
          items: { type: string }
        labels:
          type: object
          additionalProperties: { type: string }
        enabled: { type: boolean }
    RulePatchRequest:
      type: object
      description: Partial update — only fields supplied are applied.
      properties:
        name: { type: string }
        templateKind: { $ref: '#/components/schemas/TemplateKind' }
        templateSpec:
          type: object
          additionalProperties: true
        enabled: { type: boolean }
        severity: { $ref: '#/components/schemas/Severity' }
        schedule: { $ref: '#/components/schemas/Schedule' }
        notifications:
          type: array
          items: { type: string }
        labels:
          type: object
          additionalProperties: { type: string }
    RuleResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Rule' }
    RulesCursorResponse:
      type: object
      required: [cursor]
      properties:
        cursor:
          type: object
          required: [pageSize, hasMore, data]
          properties:
            pageSize: { type: integer, format: int64, minimum: 1, maximum: 1000 }
            hasMore: { type: boolean }
            previous: { type: string }
            next: { type: string }
            data:
              type: array
              items: { $ref: '#/components/schemas/Rule' }

    EvaluateRuleRequest:
      type: object
      properties:
        at: { type: string, format: date-time, description: "Default PIT for every source and canonical PIT for alert-period scoping. Defaults to now, but is required when `sourcePITs` is provided. Must be in the past. A supplied `at` is read point-in-time on the payments pool; the default (now) reads the pool's latest snapshot." }
        safetyMargin: { type: string, example: "30s", description: "Go duration string subtracted from the default `at` PIT. Defaults to 30s. It is not subtracted from already-effective `sourcePITs` replay values." }
        sourcePITs:
          type: object
          description: >-
            Optional per-source PIT overrides, keyed by the template's stable
            source key ("<label>#<idx>", as echoed back in
            Evaluation.pitPerSource — e.g. "ledger:main#0", "pool:acct#0"). A
            source with an override reads at exactly that instant instead of
            `at` (the safety margin is not applied again); this
            expresses the two-independent-timestamps contract (ledger at one
            instant, payments pool at another, to absorb inter-system settlement
            lag). `at` is required whenever this object is supplied so the
            evaluation has an unambiguous PIT for daily/monthly alert-period
            scoping. Every value must be in the past. A key that names no source
            of the rule's template is rejected with 400 (it is not silently ignored).
          additionalProperties: { type: string, format: date-time }
          example: { "ledger:main#0": "2026-06-30T23:59:59Z", "pool:acct#0": "2026-06-30T23:00:00Z" }
    Evaluation:
      type: object
      required: [id, ruleID, startedAt, endedAt, result, createdAt]
      properties:
        id: { type: string, format: uuid }
        ruleID: { type: string, format: uuid }
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time }
        pitPerSource:
          type: object
          description: >-
            Effective historical PITs used by sources. For a Payments `latest`
            read, the value is the successful observation time because the
            upstream response has no snapshot timestamp; the evaluation evidence
            is frozen, but exact historical replay of that latest snapshot is not guaranteed.
          additionalProperties: { type: string, format: date-time }
        result: { type: string, enum: [PASS, FAIL, ERROR] }
        evidence:
          description: >-
            For PASS/FAIL: the per-fingerprint roster. Each PASS entry carries a
            compact `proof`: the observed balances that make the check hold, with
            self-describing keys — both sides where two are compared, e.g.
            {"ledger":"523500","pool":"-523500"} (drift), {"left":…,"right":…}
            (source_parity), {"positive":…,"negative":…} (ledger_invariant), or
            {"balance":…} (account_threshold). These reuse the FAIL balance keys,
            so under tolerance the residual (left−right) is visible without
            recomputation. Each FAIL entry carries the full `evidence` breakdown
            (balances, drift, tolerance, compiled CEL). Bounded by asset count
            (per-asset granularity; per-account is parked). An empty array means no
            outcomes were produced (no assets matched). For ERROR: an object
            describing the engine failure.
          oneOf:
            - type: array
              items:
                type: object
                properties:
                  fingerprint: { type: string }
                  passed: { type: boolean }
                  proof:
                    type: object
                    additionalProperties: { type: string }
                    description: Compact green-proof (observed balance integers as strings). Present on PASS entries.
                  evidence:
                    type: object
                    additionalProperties: true
                    description: Full breakdown. Present on FAIL entries.
                additionalProperties: true
            - type: object
              additionalProperties: true
        error: { type: string }
        costUnits: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
    EvaluationResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Evaluation' }
    EvaluationsCursorResponse:
      type: object
      required: [cursor]
      properties:
        cursor:
          type: object
          required: [pageSize, hasMore, data]
          properties:
            pageSize: { type: integer, format: int64 }
            hasMore: { type: boolean }
            previous: { type: string }
            next: { type: string }
            data:
              type: array
              items: { $ref: '#/components/schemas/Evaluation' }

    Alert:
      type: object
      description: |
        An Alert is the stable, dedup'd record of a failing fingerprint within a
        reconciliation period. There is exactly one Alert per
        (ruleID, fingerprint, periodID) — within a period, re-opens after resolve
        flip the status back to OPEN in place; the same fingerprint failing in a
        new period is a separate Alert. For a `continuous`-cadence rule there is
        one unbounded period, so it behaves as one Alert per (ruleID, fingerprint).
        The full history of transitions lives in alert_event
        (see /alerts/{alertID}/events).
      required: [id, ruleID, fingerprint, periodID, status, severity, firstSeenAt, lastSeenAt, occurrenceCount, lastEvaluationID, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        ruleID: { type: string, format: uuid }
        fingerprint: { type: string, example: "asset:USD/2" }
        periodID: { type: string, example: "2026-03", description: "Reconciliation period this alert is scoped to ('continuous' for live-monitoring rules)." }
        status: { type: string, enum: [OPEN, ACKNOWLEDGED, RESOLVED] }
        severity: { $ref: '#/components/schemas/Severity' }
        firstSeenAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        occurrenceCount: { type: integer, format: int64, description: "Count of FAIL events on this alert across reopen cycles within its period (lifetime, for a continuous-cadence rule)." }
        lastEvaluationID: { type: string, format: uuid }
        evidence:
          type: object
          additionalProperties: true
        ack: { $ref: '#/components/schemas/Ack' }
        resolution: { $ref: '#/components/schemas/Resolution' }
        snooze: { $ref: '#/components/schemas/Snooze' }
        labels:
          type: object
          additionalProperties: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AlertResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Alert' }
    AlertsCursorResponse:
      type: object
      required: [cursor]
      properties:
        cursor:
          type: object
          required: [pageSize, hasMore, data]
          properties:
            pageSize: { type: integer, format: int64 }
            hasMore: { type: boolean }
            previous: { type: string }
            next: { type: string }
            data:
              type: array
              items: { $ref: '#/components/schemas/Alert' }

    AlertEvent:
      type: object
      description: |
        One row of the alert's append-only event log. Captures every
        evaluation that touched the alert plus every manual transition
        (ack / resolve / accept / snooze / unsnooze). `prevStatus` is null
        only for the inaugural event of an alert. `isReopen` is a derived
        predicate — true when a FAIL event lands on a previously-RESOLVED alert.
        `notify` is the notification decision recorded for the row: false marks
        a transition kept for audit but deliberately not published (a repeated
        identical fail, or a fail muted by an active snooze).
      required: [id, alertID, type, newStatus, at, isReopen, notify]
      properties:
        id: { type: string, format: uuid }
        alertID: { type: string, format: uuid }
        evaluationID: { type: string, format: uuid, nullable: true }
        type: { type: string, enum: [fail, pass, ack, resolve, accept, snooze, unsnooze] }
        prevStatus: { type: string, enum: [OPEN, ACKNOWLEDGED, RESOLVED], nullable: true }
        newStatus: { type: string, enum: [OPEN, ACKNOWLEDGED, RESOLVED] }
        payload:
          description: Event-type-specific payload (evidence for fail, resolution for resolve/accept, ack object for ack, snooze object for snooze).
          type: object
          additionalProperties: true
        at: { type: string, format: date-time }
        isReopen: { type: boolean }
        notify: { type: boolean, description: "Whether this transition was published to the message bus. false = recorded for audit but suppressed." }
    AlertEventsCursorResponse:
      type: object
      required: [cursor]
      properties:
        cursor:
          type: object
          required: [pageSize, hasMore, data]
          properties:
            pageSize: { type: integer, format: int64 }
            hasMore: { type: boolean }
            previous: { type: string }
            next: { type: string }
            data:
              type: array
              items: { $ref: '#/components/schemas/AlertEvent' }

    AckAlertRequest:
      type: object
      required: [by]
      properties:
        by: { type: string, example: "ops@buildr.com" }
        note: { type: string }
    ResolveAlertRequest:
      type: object
      required: [by]
      description: |
        Mark an alert resolved. When `transactionRefs` is non-empty the
        resolution kind is recorded as `fixed_by_booking`.
      properties:
        by: { type: string }
        note: { type: string }
        transactionRefs:
          type: array
          items: { type: string }
    AcceptAlertRequest:
      type: object
      required: [by, note]
      description: Business acceptance. `note` is required and the evidence is snapshotted onto the resolution.
      properties:
        by: { type: string }
        note: { type: string, minLength: 1 }
    SnoozeAlertRequest:
      type: object
      required: [by, until]
      description: Mute an alert's notifications until `until` (which must be in the future).
      properties:
        by: { type: string, example: "ops@buildr.com" }
        until: { type: string, format: date-time }
        note: { type: string }
    UnsnoozeAlertRequest:
      type: object
      required: [by]
      properties:
        by: { type: string, example: "ops@buildr.com" }
