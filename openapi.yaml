    BalanceBoundsRuleRequestV2:
      allOf:
        - $ref: '#/components/schemas/RuleRequestCommonV2'
        - type: object
          required: [templateKind, templateSpec]
          properties:
            templateKind: { type: string, enum: [balance_bounds] }
            templateSpec: { $ref: '#/components/schemas/BalanceBoundsSpecV2' }
    StaleHoldsRuleRequestV2:
      allOf:
        - $ref: '#/components/schemas/RuleRequestCommonV2'
        - type: object
          required: [templateKind, templateSpec]
          properties:
            templateKind: { type: string, enum: [stale_holds] }
            templateSpec: { $ref: '#/components/schemas/StaleHoldsSpecV2' }
    RuleRequestV2:
      oneOf:
        - $ref: '#/components/schemas/BalanceEquationRuleRequestV2'
        - $ref: '#/components/schemas/ExchangeRateBoundsRuleRequestV2'
        - $ref: '#/components/schemas/SourceConsensusRuleRequestV2'
        - $ref: '#/components/schemas/CoverageRatioBoundsRuleRequestV2'
        - $ref: '#/components/schemas/StaleHoldsRuleRequestV2'
        - $ref: '#/components/schemas/BalanceBoundsRuleRequestV2'
      discriminator:
        propertyName: templateKind
        mapping:
